<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freie IPSC Matches</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .match-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .match-card {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .match-card h3 {
            margin-top: 0;
            color: #2980b9;
            font-size: 1.2em;
            line-height: 1.4;
        }
        .badge {
            display: inline-block;
            background-color: #e74c3c;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .btn-contact {
            display: block;
            text-align: center;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-contact:hover {
            background-color: #2ecc71;
        }
        .error-msg {
            text-align: center;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Verfügbare Startplätze (unter 100%)</h1>
    
    <div id="js-match-container" class="match-container">
        <p style="text-align: center; width: 100%;">Lade aktuelle Matches...</p>
    </div>

    <script>
        // Lade die JSON-Datei, die unser GitHub-Bot regelmäßig aktualisiert
        fetch('matches.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Fehler beim Laden der Datei");
                }
                return response.json();
            })
            .then(matches => {
                const container = document.getElementById('js-match-container');
                
                if (matches.length === 0) {
                    container.innerHTML = '<p style="text-align: center; width: 100%;">Aktuell sind leider alle Matches zu 100% ausgebucht.</p>';
                    return;
                }

                // Generiere den HTML-Code für jedes gefundene Match
                let html = '';
                matches.forEach(match => {
                    html += `
                        <div class="match-card">
                            <div>
                                <!-- Hier wird der Name des Matches eingefügt -->
                                <h3>${match.name}</h3>
                                <span class="badge">Auslastung: ${match.auslastung}</span>
                            </div>
                            <!-- Hier ist der Link zu ipscmatch.de (öffnet in neuem Tab) -->
                            <a href="${match.url}" target="_blank" class="btn-contact">Zum Match</a>
                        </div>
                    `;
                });
                
                // Füge die fertigen Karten in die Webseite ein
                container.innerHTML = html;
            })
            .catch(error => {
                console.error("Fehler:", error);
                document.getElementById('js-match-container').innerHTML = '<p class="error-msg">Die aktuellen Matches konnten nicht geladen werden. Bitte lade die Seite neu.</p>';
            });
    </script>

</body>
</html>
