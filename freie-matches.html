<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freie Match-Plätze | Startplatz Börse</title>
    <style>
        :root { --bg-color: #1a1a1a; --card-bg: #2d2d2d; --accent-color: #ff9f43; --text-color: #ffffff; --text-muted: #aaaaaa; --danger-color: #ff4d4d; --success-color: #2ecc71; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        header { background-color: #0f0f0f; padding: 20px; text-align: center; border-bottom: 3px solid var(--accent-color); }
        .nav { margin-top: 20px; display: flex; justify-content: center; gap: 20px; }
        .nav a { color: var(--text-muted); text-decoration: none; font-weight: bold; }
        .nav a.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); }
        .container { max-width: 800px; margin: 30px auto; padding: 20px; }
        .match-card { background: var(--card-bg); padding: 15px; margin-bottom: 10px; border-left: 4px solid var(--success-color); display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
        .btn { background: var(--success-color); color: #000; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>IPSC STARTPLATZ-BÖRSE</h1>
        <div class="nav">
            <a href="index.html">Marktplatz</a>
            <a href="freie-matches.html" class="active">Freie Match-Plätze</a>
        </div>
    </header>

    <div class="container" id="match-container">
        <p>Lade Daten von ipscmatch.de... (Bitte warten)</p>
    </div>

    <script>
        const CONTAINER = document.getElementById('match-container');
        const CACHE_KEY = 'matches_data';
        
        // Cache laden, falls vorhanden (10 Minuten gültig)
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
        if(cached && (Date.now() - cached.time < 600000)) {
            CONTAINER.innerHTML = cached.html;
        } else {
            fetchMatches();
        }

        function fetchMatches() {
            // Wir nutzen einen alternativen Mirror, um 408/Timeout zu vermeiden
            const url = 'https://api.allorigins.win/get?url=' + encodeURIComponent('https://www.ipscmatch.de/');
            
            fetch(url)
                .then(r => r.json())
                .then(data => {
                    const doc = new DOMParser().parseFromString(data.contents, 'text/html');
                    let html = '';
                    doc.querySelectorAll('table tr').forEach(row => {
                        if(row.textContent.includes('%') && !row.textContent.includes('100%')) {
                            html += `<div class="match-card">
                                        <div><strong>${row.cells[0]?.textContent || 'Match'}</strong></div>
                                        <a href="https://www.ipscmatch.de" class="btn" target="_blank">Anmelden</a>
                                     </div>`;
                        }
                    });
                    
                    if(html) {
                        localStorage.setItem(CACHE_KEY, JSON.stringify({html, time: Date.now()}));
                        CONTAINER.innerHTML = html;
                    } else {
                        CONTAINER.innerHTML = '<p>Aktuell keine freien Plätze gefunden.</p>';
                    }
                })
                .catch(() => {
                    CONTAINER.innerHTML = '<p>Fehler: Verbindung zu ipscmatch.de nicht möglich. Bitte später versuchen.</p>';
                });
        }
    </script>
</body>
</html>
