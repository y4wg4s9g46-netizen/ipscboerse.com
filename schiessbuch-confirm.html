<script>
const SUPABASE_URL = "https://huprxirlthkisjngwash.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yModrA5JZTiN5Cw7MHQqLQ_Coc04WAS";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let token = new URLSearchParams(window.location.search).get("t") || "";
let tokenHash = "";
let confirmation = null;
let canvas, ctx, drawing = false;

function stableStringify(value) {
  if (value === null || typeof value !== "object") return JSON.stringify(value);
  if (Array.isArray(value)) return "[" + value.map(stableStringify).join(",") + "]";
  return "{" + Object.keys(value).sort().map(key => JSON.stringify(key) + ":" + stableStringify(value[key])).join(",") + "}";
}
async function sha256Hex(value) {
  const encoded = new TextEncoder().encode(String(value));
  const digest = await crypto.subtle.digest("SHA-256", encoded);
  return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, "0")).join("");
}
function shortHash(hash) { return hash ? `${String(hash).slice(0, 12)}…${String(hash).slice(-8)}` : "—"; }
function escapeHtml(value) {
  return String(value || "").replace(/[&<>"']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[m]));
}
function showError(msg) {
  document.getElementById("loading").style.display = "none";
  const el = document.getElementById("error");
  el.textContent = msg;
  el.style.display = "block";
}
function renderEntry(data) {
  const snap = data.entry_snapshot || {};
  document.getElementById("entry-box").innerHTML = `
    <div class="entry-row"><span>Datum</span><strong>${escapeHtml(snap.datum)}</strong></div>
    <div class="entry-row"><span>Ort</span><strong>${escapeHtml(snap.ort)}</strong></div>
    <div class="entry-row"><span>Disziplin</span><strong>${escapeHtml(snap.disziplin)}</strong></div>
    <div class="entry-row"><span>Waffe/Kaliber</span><strong>${escapeHtml(snap.waffe)}</strong></div>
    <div class="entry-row"><span>Schusszahl</span><strong>${escapeHtml(snap.schusszahl)}</strong></div>
  `;
  document.getElementById("hash-box").innerHTML = `
    Entry-Hash: ${escapeHtml(shortHash(data.entry_hash))}<br>
    Chain-Hash: ${escapeHtml(shortHash(data.chain_hash))}<br>
    Prüfcode: ${escapeHtml(data.verify_code || "wird nach Bestätigung aktiv")}
  `;
}
async function loadConfirmation() {
  document.getElementById("loading").style.display = "block";
  if (!token || token.length < 20) return showError("Ungültiger oder fehlender Bestätigungslink.");
  tokenHash = await sha256Hex(token);
  const { data, error } = await supabaseClient.rpc("get_schiessbuch_confirmation_by_token", { p_token_hash: tokenHash });
  if (error) return showError("Link konnte nicht geladen werden: " + error.message);
  if (!data || data.status !== "pending") return showError("Dieser Link ist ungültig, abgelaufen oder bereits verbraucht.");
  confirmation = data;
  renderEntry(data);
  document.getElementById("loading").style.display = "none";
  document.getElementById("confirm-content").style.display = "block";
  setTimeout(initCanvas, 30);
}
function initCanvas() {
  canvas = document.getElementById("signature-pad");
  ctx = canvas.getContext("2d");
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  canvas.addEventListener("mouseup", stop);
  canvas.addEventListener("mouseleave", stop);
  canvas.addEventListener("touchstart", e => { e.preventDefault(); start(e.touches[0]); }, { passive:false });
  canvas.addEventListener("touchmove", e => { e.preventDefault(); move(e.touches[0]); }, { passive:false });
  canvas.addEventListener("touchend", stop);
}
function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const ratio = Math.max(window.devicePixelRatio || 1, 1);
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#0f172a";
}
function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function start(e) { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
function move(e) { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
function stop() { drawing = false; }
function clearSignature() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
async function submitConfirmation() {
  const name = document.getElementById("confirmer-name").value.trim();
  const license = document.getElementById("confirmer-license").value.trim();
  if (!name) return alert("Bitte Namen eintragen.");
  const signatureData = canvas.toDataURL("image/png");
  if (signatureData.length < 3000) return alert("Bitte im Feld unterschreiben.");
  const signatureHash = await sha256Hex(signatureData);
  const confirmedAt = new Date().toISOString();
  const confirmationHash = await sha256Hex(stableStringify({
    entry_hash: confirmation.entry_hash,
    chain_hash: confirmation.chain_hash,
    signature_hash: signatureHash,
    confirmer_name: name,
    confirmer_license: license,
    confirmed_at: confirmedAt
  }));

  const { data, error } = await supabaseClient.rpc("submit_schiessbuch_external_confirmation", {
    p_token_hash: tokenHash,
    p_name: name,
    p_license: license || null,
    p_signature_data: signatureData,
    p_signature_hash: signatureHash,
    p_confirmation_hash: confirmationHash,
    p_user_agent: navigator.userAgent || ""
  });

  if (error) return showError("Bestätigung konnte nicht gespeichert werden: " + error.message);
  document.querySelector(".btn-primary").disabled = true;
  document.querySelector(".btn-secondary").disabled = true;
  const success = document.getElementById("success");
  success.textContent = "Danke. Der Schießbuch-Eintrag wurde bestätigt, signiert und gesperrt.";
  success.style.display = "block";
}
loadConfirmation();
</script>

      if (a.target && a.target !== "_self") return;

      var url;

      if (url.origin !== window.location.origin) return;
      if (url.pathname === window.location.pathname && url.search === window.location.search) return;

      event.preventDefault();
      ensureCurtain();
      document.documentElement.classList.add("is-native-navigating-v74");
      setTimeout(function () { window.location.href = url.href; }, 54);
    }, true);
  });

  window.addEventListener("pageshow", markLoaded);
})();
