<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Passwort zurücksetzen</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>Neues Passwort festlegen</h2>
    <form id="update-password-form">
        <input type="password" id="new-password" placeholder="Neues Passwort" required>
        <button type="submit">Passwort speichern</button>
    </form>

    <script>
        // Deine Supabase-Daten (aus deiner app.js)
        const SUPABASE_URL = "https://huprxirlthkisjngwash.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_mPH_ETwGVhcm7pr35WVPWA_KgJu5N_e";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('update-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            
            // Passwort in Supabase aktualisieren
            const { data, error } = await supabase.auth.updateUser({ password: newPassword });
            
            if (error) {
                alert("Fehler: " + error.message);
            } else {
                alert("Passwort erfolgreich geändert!");
                // Nach Erfolg zurück zur Startseite
                window.location.href = 'https://y4wg4s9g46-netizen.github.io/ipscboerse.com/';
            }
        });
    </script>
</body>
</html>
