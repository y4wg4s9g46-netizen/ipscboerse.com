    <script id="theme-prepaint-script-v70">

          theme = selected || legacy || "light";
          if (theme === "auto") {
            theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (theme !== "light" && theme !== "dark") theme = "light";
        } catch (_) {
          theme = "light";
        }

        try {
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);

<body class="app-v71 app-v72 app-v73 app-v74 app-v75 app-v76 app-v76b app-v76c app-v76d">
<div class="verify-shell">
  <div class="verify-card">
    <h1>QR-Prüfung Schießbuch</h1>
    <p style="color:var(--text-muted);font-weight:650;line-height:1.4;">Hier kann geprüft werden, ob der digital bestätigte Eintrag vorhanden ist und seine Hashdaten gültig gespeichert wurden.</p>
    <div id="result" class="status">Lade Prüfung...</div>
    <div id="details"></div>
  </div>
</div>
<script>
const SUPABASE_URL = "https://huprxirlthkisjngwash.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_yModrA5JZTiN5Cw7MHQqLQ_Coc04WAS";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
function esc(v){return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function shortHash(h){return h ? `${String(h).slice(0,16)}…${String(h).slice(-10)}` : "—";}
async function loadVerify(){
  const code = new URLSearchParams(location.search).get("id") || "";
  const result = document.getElementById("result");
  const details = document.getElementById("details");
  if(!code){ result.className="status bad"; result.textContent="Kein Prüfcode übergeben."; return; }
  const { data, error } = await supabaseClient.rpc("verify_schiessbuch_confirmation", { p_verify_code: code });
  if(error || !data || !data.is_valid){
    result.className="status bad";
    result.textContent = "Prüfung fehlgeschlagen oder Eintrag nicht gefunden.";
    return;
  }
  const snap = data.entry_snapshot || {};
  result.className="status ok";
  result.textContent = "✅ Eintrag vorhanden, bestätigt und mit Hashdaten gespeichert.";
  details.innerHTML = `
    <div class="row"><span>Datum</span><strong>${esc(snap.datum)}</strong></div>
    <div class="row"><span>Ort</span><strong>${esc(snap.ort)}</strong></div>
    <div class="row"><span>Disziplin</span><strong>${esc(snap.disziplin)}</strong></div>
    <div class="row"><span>Waffe/Kaliber</span><strong>${esc(snap.waffe)}</strong></div>
    <div class="row"><span>Schusszahl</span><strong>${esc(snap.schusszahl)}</strong></div>
    <div class="row"><span>Bestätigt durch</span><strong>${esc(data.confirmer_name)}</strong></div>
    ${data.confirmer_license ? `<div class="row"><span>Lizenznummer</span><strong>${esc(data.confirmer_license)}</strong></div>` : ""}
    <div class="row"><span>Bestätigt am</span><strong>${esc(new Date(data.confirmed_at).toLocaleString("de-DE"))}</strong></div>
    <div style="margin-top:15px;color:var(--text-muted);font-size:12px;line-height:1.5;">
      Entry-Hash:<br><code>${esc(shortHash(data.entry_hash))}</code><br>
      Chain-Hash:<br><code>${esc(shortHash(data.chain_hash))}</code><br>
      Confirmation-Hash:<br><code>${esc(shortHash(data.confirmation_hash))}</code>
    </div>
  `;
}
loadVerify();
</script>

<script id="native-app-experience-script-v74">
(function () {
  if (window.__IPSC_NATIVE_EXPERIENCE_V74) return;
  window.__IPSC_NATIVE_EXPERIENCE_V74 = true;

  function activeTheme() {
    var t = document.documentElement.getAttribute("data-theme") || window.__IPSC_ACTIVE_THEME_V74 || window.__IPSC_ACTIVE_THEME_V70 || "light";
    return t === "dark" ? "dark" : "light";
  }

  function ensureCurtain() {
    ["native-page-curtain-v72", "native-page-curtain-v73"].forEach(function(id){
      var old = document.getElementById(id);
      if (old && old.parentNode) old.parentNode.removeChild(old);
    });

    var curtain = document.getElementById("native-page-curtain-v74");
    if (!curtain) {
      curtain = document.createElement("div");
      curtain.id = "native-page-curtain-v74";
      document.body.appendChild(curtain);
    }
    curtain.style.background = activeTheme() === "dark" ? "#0f172a" : "#f6f8fc";
    return curtain;
  }

  function markLoaded() {
    document.documentElement.classList.remove("is-native-arriving-v72", "is-native-navigating-v72", "is-native-arriving-v73", "is-native-navigating-v73", "is-native-arriving-v74", "is-native-navigating-v74");
    ensureCurtain();
  }

  document.addEventListener("DOMContentLoaded", function () {
    markLoaded();

    document.addEventListener("click", function (event) {
      var a = event.target.closest && event.target.closest("a[href]");
      if (!a) return;

      var href = a.getAttribute("href") || "";
      if (!href || href.startsWith("#") || href.startsWith("mailto:") || href.startsWith("tel:") || href.startsWith("javascript:")) return;
      if (a.target && a.target !== "_self") return;
      if (a.hasAttribute("download")) return;

      var url;
      try { url = new URL(href, window.location.href); } catch (_) { return; }
      if (url.origin !== window.location.origin) return;
      if (url.pathname === window.location.pathname && url.search === window.location.search) return;

      event.preventDefault();
      ensureCurtain();
      document.documentElement.classList.add("is-native-navigating-v74");
      setTimeout(function () { window.location.href = url.href; }, 54);
    }, true);
  });

  window.addEventListener("pageshow", markLoaded);
})();
</script>
