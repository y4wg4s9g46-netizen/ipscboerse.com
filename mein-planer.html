        background-color: #0f172a;

        min-height: 100%;

        background-color: #f6f8fc !important;

    </style>
    <script id="native-dark-prepaint-script-v65">
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("selectedTheme") || localStorage.getItem("theme") || "dark";
          if (saved === "auto") {
            saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (_) {}
        try {
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.backgroundColor = theme === "dark" ? "#0f172a" : "#f6f8fc";
          document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";
        } catch (_) {}
      })();
    </script>

    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("theme") || localStorage.getItem("selectedTheme") || "dark";
          if (savedTheme !== "light" && savedTheme !== "dark") savedTheme = "dark";
          document.documentElement.setAttribute("data-theme", savedTheme);
          document.documentElement.style.backgroundColor = savedTheme === "dark" ? "#0f172a" : "#f6f8fc";
          document.documentElement.style.colorScheme = savedTheme === "dark" ? "dark" : "light";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.style.backgroundColor = "#0f172a";
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>

    <script id="theme-sync-v52">
      (function () {
        try {
          var selected = localStorage.getItem("selectedTheme");
          var legacy = localStorage.getItem("theme");
          var theme = selected || legacy || "light";

          if (theme === "auto") {
            theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }

          if (theme !== "light" && theme !== "dark") theme = "light";

          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.backgroundColor = theme === "dark" ? "#0f172a" : "#f6f8fc";
          document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";

          localStorage.setItem("selectedTheme", theme);
          localStorage.setItem("theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.style.backgroundColor = "#f6f8fc";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>

<script src="app.js?v=25"></script>
    <script>
        let myMatches = [];

        function escapeHtml(text) { const div = document.createElement("div"); div.textContent = text; return div.innerHTML; }

        window.onAuthChange = (user) => {
            if (user) {
                document.getElementById('logged-out-section').style.display = 'none';
                document.getElementById('planner-section').style.display = 'block';
                loadMatchesFromSupabase();
            } else {
                document.getElementById('logged-out-section').style.display = 'block';
                document.getElementById('planner-section').style.display = 'none';
                document.getElementById('match-list').innerHTML = '';
            }
        };

        async function loadMatchesFromSupabase() {
            if (!window.currentUser) return;
            const { data, error } = await window.supabaseClient.from('user_matches').select('*').order('match_date', { ascending: true });
            if (error) { console.error("Fehler beim Laden:", error); return; }
            myMatches = data || [];
            renderMatches();
        }

        async function addMatch() {
            const name = document.getElementById('match-name').value.trim();
            const date = document.getElementById('match-date').value;
            const location = document.getElementById('match-location').value.trim();

            if (!name || !date) { alert("Match-Name und Datum sind Pflichtfelder."); return; }
            const { error = null } = await window.supabaseClient.from('user_matches').insert([{ user_id: window.currentUser.id, match_name: name, match_date: date, match_location: location }]);
            if (error) { alert("Fehler beim Speichern: " + error.message); return; }

            document.getElementById('match-name').value = '';
            document.getElementById('match-date').value = '';
            document.getElementById('match-location').value = '';
            loadMatchesFromSupabase();
        }

        async function deleteMatch(id) {
            const { error } = await window.supabaseClient.from('user_matches').delete().eq('id', id);
            if (!error) loadMatchesFromSupabase();
        }

        function formatPlannerLocation(rawLocation) {
            let value = String(rawLocation || "-").trim();
            if (!value || value === "-") return "-";

            // Entfernt GPS-Koordinaten am Ende, z.B. "49.95549043478704, 9.783251740550964"
            value = value
                .replace(/\s*\|?\s*-?\d{1,3}\.\d{4,}\s*,\s*-?\d{1,3}\.\d{4,}\s*$/g, "")
                .replace(/\s+-?\d{1,3}\.\d{4,}\s*,\s*-?\d{1,3}\.\d{4,}\s*$/g, "")
                .replace(/\s{2,}/g, " ")
                .replace(/\s*,\s*$/g, "")
                .trim();

            return value || "-";
        }


        function hasPlannerMapLocationV64(rawLocation) {
            const value = formatPlannerLocation(rawLocation);
            return !!value && value !== "-";
        }

        function getPlannerMapQueryV64(rawLocation, matchName = "") {
            const location = formatPlannerLocation(rawLocation);
            if (!location || location === "-") return "";
            const name = String(matchName || "").trim();
            // Matchname dazunehmen, wenn der Ort sehr kurz ist – hilft bei Suchtreffern.
            if (name && location.length < 18 && !location.toLowerCase().includes(name.toLowerCase())) {
                return `${name}, ${location}`;
            }
            return location;
        }

        function openPlannerMapV64(rawLocation, provider, matchName = "") {
            const query = getPlannerMapQueryV64(rawLocation, matchName);
            if (!query) return;

            const encoded = encodeURIComponent(query);
            const isApple = provider === "apple";
            const isGoogle = provider === "google";
            const nativeLike = !!(
                (window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform()) ||
                document.documentElement.classList.contains("is-native-shell") ||
                document.body.classList.contains("is-app-shell")
            );

            if (isApple) {
                const appleWeb = `https://maps.apple.com/?q=${encoded}`;
                const appleNative = `maps://?q=${encoded}`;

                if (nativeLike) {
                    // In der iOS-App direkt Apple Karten anstoßen.
                    window.location.href = appleNative;
                    setTimeout(() => {
                        try {
                            const Browser = window.Capacitor?.Plugins?.Browser;
                            if (Browser && Browser.open) {
                                Browser.open({ url: appleWeb });
                            } else {
                                window.open(appleWeb, "_blank", "noopener,noreferrer");
                            }
                        } catch (_) {
                            window.open(appleWeb, "_blank", "noopener,noreferrer");
                        }
                    }, 650);
                } else {
                    window.open(appleWeb, "_blank", "noopener,noreferrer");
                }
                return;
            }

            if (isGoogle) {
                const googleWeb = `https://www.google.com/maps/search/?api=1&query=${encoded}`;
                const googleNative = `comgooglemaps://?q=${encoded}`;

                if (nativeLike) {
                    window.location.href = googleNative;
                    setTimeout(() => {
                        try {
                            const Browser = window.Capacitor?.Plugins?.Browser;
                            if (Browser && Browser.open) {
                                Browser.open({ url: googleWeb });
                            } else {
                                window.open(googleWeb, "_blank", "noopener,noreferrer");
                            }
                        } catch (_) {
                            window.open(googleWeb, "_blank", "noopener,noreferrer");
                        }
                    }, 650);
                } else {
                    window.open(googleWeb, "_blank", "noopener,noreferrer");
                }
            }
        }

        function buildPlannerMapButtonsV64(rawLocation, matchName = "") {
            if (!hasPlannerMapLocationV64(rawLocation)) return "";

            const safeRaw = encodeURIComponent(String(rawLocation || ""));
            const safeName = encodeURIComponent(String(matchName || ""));

            return `
                <span class="planner-map-actions">
                    <button type="button" class="planner-map-btn apple" onclick="openPlannerMapV64(decodeURIComponent('${safeRaw}'), 'apple', decodeURIComponent('${safeName}'))"> Karten</button>
                    <button type="button" class="planner-map-btn" onclick="openPlannerMapV64(decodeURIComponent('${safeRaw}'), 'google', decodeURIComponent('${safeName}'))">Google Maps</button>
                </span>
            `;
        }


        function renderMatches() {
            const container = document.getElementById('match-list');
            if (!container) return;
            container.innerHTML = '';

            if (myMatches.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); font-style: italic; font-weight: 600;" data-txt="planner-no-matches">Noch keine Matches eingetragen.</p>';
                return;
            }

            myMatches.forEach(match => {
                const dateObj = new Date(match.match_date);
                const displayDate = dateObj.toLocaleDateString('de-DE');
                const safeName = encodeURIComponent(match.match_name);
                const safeLocation = encodeURIComponent(match.match_location || '');
                
                let matchTitleHtml = escapeHtml(match.match_name);
                if (match.match_url) {
                    matchTitleHtml = `<a href="${escapeHtml(match.match_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(match.match_name)} 🔗</a>`;
                }

                let badgesHtml = '';
                if (match.auto_imported) {
                    badgesHtml += `<span class="badge badge-bot">🤖 Auto-Import</span>`;
                }

                if (match.status) {
                    const statusLower = match.status.toLowerCase();
                    if (statusLower.includes('approved') || statusLower.includes('bestätigt')) {
                        badgesHtml += `<span class="badge badge-approved">Approved</span>`;
                    } else if (statusLower.includes('warteliste') || statusLower.includes('waiting')) {
                        badgesHtml += `<span class="badge badge-warteliste">Warteliste</span>`;
                    } else {
                        badgesHtml += `<span class="badge badge-pending">${escapeHtml(match.status)}</span>`;
                    }
                }

                if (match.squad && match.squad !== 'TBD') {
                    badgesHtml += `<span class="badge badge-squad">${escapeHtml(match.squad)}</span>`;
                }

                // Inline-Styles für Inserieren-Button für Premium-Look leicht angepasst
                container.innerHTML += `
                    <div class="match-item">
                        <div>
                            <h4>${matchTitleHtml} ${badgesHtml}</h4>
                            <p>📅 ${displayDate}</p>
                            <div class="planner-location-row">
                                <span class="planner-location-text">📍 ${escapeHtml(formatPlannerLocation(match.match_location))}</span>
                                ${buildPlannerMapButtonsV64(match.match_location, match.match_name)}
                            </div>
                        </div>
                        <div class="planner-card-actions">
                            <button class="planner-insert-btn" onclick="inserierenAufMarktplatz('${safeName}', '${match.match_date}', '${safeLocation}')">📢 Inserieren</button>
                            <button onclick="deleteMatch(${match.id})" class="delete-btn planner-delete-btn">Löschen</button>
                        </div>
                    </div>
                `;
            });
        }
        
        function inserierenAufMarktplatz(name, date, location) {
            const params = new URLSearchParams({ from_planner: 'true', name: decodeURIComponent(name), date: date, location: decodeURIComponent(location) });
            window.location.href = 'marktplatz.html?' + params.toString();
        }

        function exportToCalendar() {
            if (myMatches.length === 0) { alert("Keine Matches zum Exportieren."); return; }
            let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//IPSC Boerse//Wettkampfplaner//DE\nCALSCALE:GREGORIAN\n";
            myMatches.forEach(match => {
                const dateStr = match.match_date.replace(/-/g, '');
                icsContent += "BEGIN:VEVENT\n";
                icsContent += `DTSTART;VALUE=DATE:${dateStr}\n`;
                const endDate = new Date(match.match_date);
                endDate.setDate(endDate.getDate() + 1);
                const endStr = endDate.toISOString().split('T')[0].replace(/-/g, '');
                icsContent += `DTEND;VALUE=DATE:${endStr}\n`;
                icsContent += `SUMMARY:${match.match_name}\n`;
                if(match.match_location) icsContent += `LOCATION:${match.match_location}\n`;
                icsContent += "DESCRIPTION:Wettkampf eingetragen über ipscboerse.com\n";
                icsContent += "END:VEVENT\n";
            });
            icsContent += "END:VCALENDAR";

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'meine_ipsc_matches.ics';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onLanguageChanged = () => { renderMatches(); };
    </script>

    <script>
        (function() {
            const plannerPanel = document.getElementById("planner-form-panel");
            const plannerToggle = document.getElementById("planner-form-toggle");

            function setPlannerFormOpen(open) {
                if (!plannerPanel || !plannerToggle) return;

                plannerPanel.hidden = !open;
                plannerPanel.classList.toggle("is-open", open);
                plannerToggle.classList.toggle("is-open", open);
                plannerToggle.setAttribute("aria-expanded", open ? "true" : "false");

                const icon = plannerToggle.querySelector(".planner-form-toggle-icon");
                if (icon) icon.textContent = open ? "–" : "+";
            }

            window.openPlannerForm = function() {
                setPlannerFormOpen(true);
                setTimeout(() => {
                    document.getElementById("planner-form-anchor")?.scrollIntoView({ behavior: "smooth", block: "start" });
                }, 80);
            };

            window.closePlannerForm = function() {
                setPlannerFormOpen(false);
            };

            if (plannerToggle) {
                plannerToggle.addEventListener("click", () => {
                    const isOpen = plannerToggle.getAttribute("aria-expanded") === "true";
                    setPlannerFormOpen(!isOpen);
                });
            }

            setPlannerFormOpen(false);
        })();
    </script>
