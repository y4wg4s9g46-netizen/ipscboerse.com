        function formatPlannerLocation(rawLocation) {
            let value = String(rawLocation || "-").trim();
            if (!value || value === "-") return "-";

            // Entfernt GPS-Koordinaten am Ende, z.B. "49.95549043478704, 9.783251740550964"
            value = value
                .replace(/\s*\|?\s*-?\d{1,3}\.\d{4,}\s*,\s*-?\d{1,3}\.\d{4,}\s*$/g, "")
                .replace(/\s+-?\d{1,3}\.\d{4,}\s*,\s*-?\d{1,3}\.\d{4,}\s*$/g, "")
                .replace(/\s{2,}/g, " ")
                .replace(/\s*,\s*$/g, "")
                .trim();

            return value || "-";
        }


        function hasPlannerMapLocationV64(rawLocation) {
            const value = formatPlannerLocation(rawLocation);
            return !!value && value !== "-";
        }

        function getPlannerMapQueryV64(rawLocation, matchName = "") {
            const location = formatPlannerLocation(rawLocation);
            if (!location || location === "-") return "";
            const name = String(matchName || "").trim();
            // Matchname dazunehmen, wenn der Ort sehr kurz ist – hilft bei Suchtreffern.
            if (name && location.length < 18 && !location.toLowerCase().includes(name.toLowerCase())) {
                return `${name}, ${location}`;
            }
            return location;
        }

        function openPlannerMapV64(rawLocation, provider, matchName = "") {
            const query = getPlannerMapQueryV64(rawLocation, matchName);
            if (!query) return;

            const encoded = encodeURIComponent(query);
            const isApple = provider === "apple";
            const isGoogle = provider === "google";
            const nativeLike = !!(
                (window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform()) ||
                document.documentElement.classList.contains("is-native-shell") ||
                document.body.classList.contains("is-app-shell")
            );

            if (isApple) {
                const appleWeb = `https://maps.apple.com/?q=${encoded}`;
                const appleNative = `maps://?q=${encoded}`;

                if (nativeLike) {
                    // In der iOS-App direkt Apple Karten anstoßen.
                    window.location.href = appleNative;
                    setTimeout(() => {
                        try {
                            const Browser = window.Capacitor?.Plugins?.Browser;
                            if (Browser && Browser.open) {
                                Browser.open({ url: appleWeb });
                            } else {
                                window.open(appleWeb, "_blank", "noopener,noreferrer");
                            }
                        } catch (_) {
                            window.open(appleWeb, "_blank", "noopener,noreferrer");
                        }
                    }, 650);
                } else {
                    window.open(appleWeb, "_blank", "noopener,noreferrer");
                }
                return;
            }

            if (isGoogle) {
                const googleWeb = `https://www.google.com/maps/search/?api=1&query=${encoded}`;
                const googleNative = `comgooglemaps://?q=${encoded}`;

                if (nativeLike) {
                    window.location.href = googleNative;
                    setTimeout(() => {
                        try {
                            const Browser = window.Capacitor?.Plugins?.Browser;
                            if (Browser && Browser.open) {
                                Browser.open({ url: googleWeb });
                            } else {
                                window.open(googleWeb, "_blank", "noopener,noreferrer");
                            }
                        } catch (_) {
                            window.open(googleWeb, "_blank", "noopener,noreferrer");
                        }
                    }, 650);
                } else {
                    window.open(googleWeb, "_blank", "noopener,noreferrer");
                }
            }

        function renderMatches() {
            const container = document.getElementById('match-list');
            if (!container) return;
            container.innerHTML = '';
            if (myMatches.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); font-style: italic; font-weight: 600;" data-txt="planner-no-matches">Noch keine Matches eingetragen.</p>';
                return;
            }
            const upcoming = [];
            const past2026 = [];
            myMatches.forEach(match => {
                const archived = isPlannerDone(match.id) || isPastPlannerMatch(match);
                if (archived && plannerYear(match) === 2026) past2026.push(match); else upcoming.push(match);
            });
            if (upcoming.length) upcoming.forEach(match => { container.innerHTML += renderPlannerCard(match, false); });
            else container.innerHTML += `<p style="color: var(--text-muted); font-style: italic; font-weight: 600;">${plannerTxtV78u('Keine offenen Matches.','No open matches.')}</p>`;

        async function savePlannerAccommodationV78n(encodedKey) {
            if (!window.currentUser || !window.supabaseClient) {
                alert(plannerTxtV78u('Bitte einloggen, um die Unterkunft zu speichern.','Please log in to save the accommodation.'));
                return;
            }
            const key = decodeURIComponent(encodedKey);
            const match = myMatches.find(m => plannerMatchKeyV78n(m) === key) || {};
            const get = (id) => document.getElementById(id)?.value || '';
            const checked = (id) => !!document.getElementById(id)?.checked;
            const payload = {
                user_id: window.currentUser.id,
                match_key: key,
                match_name: match.match_name || '',
                accommodation_name: get('acc-name-' + key).trim(),
                accommodation_address: get('acc-address-' + key).trim(),
                check_in: get('acc-checkin-' + key) || null,
                check_out: get('acc-checkout-' + key) || null,

                is_booked: checked('acc-booked-' + key)

            const hint = document.getElementById('acc-hint-' + key);
            const status = document.getElementById('acc-status-' + key);
            if (hint) hint.textContent = 'Speichere…';

                    .from('planner_accommodations')
                    .upsert(payload, { onConflict: 'user_id,match_key' })

                if (error) throw error;
                plannerAccommodationsV78n[key] = data || payload;
                if (hint) hint.textContent = 'Gespeichert ✓';

        function exportToCalendar() {
            if (myMatches.length === 0) { alert("Keine Matches zum Exportieren."); return; }
            let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//IPSC Boerse//Wettkampfplaner//DE\nCALSCALE:GREGORIAN\n";
            myMatches.forEach(match => {
                const dateStr = match.match_date.replace(/-/g, '');
                icsContent += "BEGIN:VEVENT\n";
                icsContent += `DTSTART;VALUE=DATE:${dateStr}\n`;
                const endDate = new Date(match.match_date);
                endDate.setDate(endDate.getDate() + 1);
                const endStr = endDate.toISOString().split('T')[0].replace(/-/g, '');
                icsContent += `DTEND;VALUE=DATE:${endStr}\n`;
                icsContent += `SUMMARY:${match.match_name}\n`;
                if(match.match_location) icsContent += `LOCATION:${match.match_location}\n`;

                icsContent += "END:VEVENT\n";

            icsContent += "END:VCALENDAR";

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
