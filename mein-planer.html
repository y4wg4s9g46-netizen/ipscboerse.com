<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Mein Wettkampfplaner | Startplatz Börse</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="IPSC Börse">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- HIER WURDE DIE NEUE GLOBAL.CSS VERLINKT -->
    <link rel="stylesheet" href="global.css">

    <style>
        /* ==========================================================================
           PLANER-SPEZIFISCHES LAYOUT
           ========================================================================== */
        
        #logged-out-section, #planner-section { 
            background-color: var(--card-bg); 
            padding: 32px; 
            border-radius: var(--radius-lg); 
            border: 1px solid var(--border-color); 
            margin-bottom: 30px; 
            box-shadow: var(--shadow-sm); 
        }

        .form-section h2, #planner-section h2 { 
            margin-top: 0; 
            font-size: 22px; 
            font-weight: 800; 
            color: var(--text-color); 
            letter-spacing: -0.5px;
        }

        #planner-section h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-color);
        }

        .planner-form-row { display: flex; gap: 20px; }

        .match-item { 
            background-color: var(--card-bg); 
            border-left: 4px solid var(--accent-color); 
            padding: 20px; 
            margin-bottom: 16px; 
            border-radius: var(--radius); 
            border-top: 1px solid var(--border-color); 
            border-right: 1px solid var(--border-color); 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: var(--transition);
        }
        
        .match-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--border-color);
        }

        .match-item h4 { 
            margin: 0 0 8px 0; 
            color: var(--text-color); 
            font-size: 16px; 
            font-weight: 800; 
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .match-item h4 a { color: var(--info-color); text-decoration: none; }
        .match-item h4 a:hover { text-decoration: underline; }
        .match-item p { margin: 0; font-size: 14px; color: var(--text-muted); line-height: 1.5; }
        
        /* Moderne Badges für Status, Squad und Auto-Import */
        .badge { 
            display: inline-block; 
            padding: 4px 10px; 
            font-size: 11px; 
            font-weight: 800; 
            border-radius: 6px; 
            margin-left: 4px; 
            text-transform: uppercase; 
            border: 1px solid transparent;
        }
        .badge-approved { background-color: rgba(16, 185, 129, 0.1); color: var(--success-color); border-color: rgba(16, 185, 129, 0.2); }
        .badge-pending { background-color: rgba(59, 130, 246, 0.1); color: var(--info-color); border-color: rgba(59, 130, 246, 0.2); }
        .badge-warteliste { background-color: rgba(245, 158, 11, 0.1); color: #f59e0b; border-color: rgba(245, 158, 11, 0.2); }
        .badge-bot { background-color: rgba(99, 102, 241, 0.1); color: #6366f1; text-transform: none; border-color: rgba(99, 102, 241, 0.2); }
        .badge-squad { background-color: var(--input-bg); color: var(--text-color); border-color: var(--border-color); }

        .delete-btn { 
            background-color: transparent; 
            color: var(--danger-color); 
            border: 2px solid rgba(239, 68, 68, 0.3); 
            width: auto; 
            padding: 8px 16px; 
            font-size: 13px; 
            font-weight: 700; 
            border-radius: var(--radius); 
            transition: var(--transition);
            cursor: pointer;
        }
        .delete-btn:hover { background-color: var(--danger-color); color: #fff; border-color: var(--danger-color); }

        .btn-success { 
            background: linear-gradient(135deg, var(--success-color) 0%, #059669 100%); 
            box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.3); 
            color: #fff;
            border: none;
            padding: 14px 24px;
            font-weight: 700;
            border-radius: var(--radius);
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
        }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }

        @media (max-width: 768px) {
            #logged-out-section, #planner-section { padding: 20px; }
            .planner-form-row { flex-direction: column; gap: 0; }
            .match-item { flex-direction: column; align-items: stretch; gap: 16px; }
            .match-item div[style*="display: flex"] { width: 100%; justify-content: stretch; flex-direction: column; gap: 8px !important; }
            .match-item div[style*="display: flex"] button { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <header></header>
    <script src="header.js"></script>

    <div class="container">
        
        <div id="logged-out-section" style="text-align: center;">
            <h2 data-txt="planner-logged-out-title">Nicht angemeldet</h2>
            <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 25px;" data-txt="planner-logged-out-desc">Logge dich ein, um deine Matches zu verwalten und in die Cloud zu synchronisieren.</p>
            <button class="btn-primary-auth" onclick="document.getElementById('auth-modal').style.display = 'flex'; if(typeof toggleAuthView === 'function') toggleAuthView('login');" style="width: auto; padding: 14px 32px;" data-txt="planner-logged-out-btn">Jetzt einloggen</button>
        </div>

        <div id="planner-section" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--bg-color); padding-bottom: 16px; margin-bottom: 24px;">
                <h2 style="margin: 0;" data-txt="planner-title-my-matches">Meine Matches</h2>
            </div>

            <h3 data-txt="planner-subtitle-new">Neues Match eintragen</h3>
            <div class="form-group">
                <label data-txt="planner-lbl-match-name">Match-Name</label>
                <input type="text" id="match-name" placeholder="z.B. Helmbrechts-Cup 2026">
            </div>
            
            <div class="planner-form-row">
                <div class="form-group" style="flex: 1;">
                    <label data-txt="planner-lbl-match-date">Datum</label>
                    <input type="date" id="match-date">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label data-txt="planner-lbl-match-location">Ort / Land</label>
                    <input type="text" id="match-location" placeholder="z.B. Philippsburg">
                </div>
            </div>
            <button class="btn-post" onclick="addMatch()" data-txt="planner-btn-save">Match in Cloud speichern</button>

            <h3 style="margin-top: 40px;" data-txt="planner-subtitle-planned">Geplante Matches</h3>
            <div id="match-list">
                <p style="color: var(--text-muted); font-style: italic; font-weight: 600;" data-txt="planner-loading">Lade Daten aus Supabase...</p>
            </div>

            <button onclick="exportToCalendar()" class="btn-success" style="margin-top: 24px; font-size: 15px;" data-txt="planner-btn-export">📅 In Kalender exportieren (.ics)</button>
        </div>

    </div>

    <footer>
        <div style="max-width: 1000px; margin: 0 auto; text-align: center;">
            <a href="/impressum.html" style="color: var(--info-color); text-decoration: none; font-weight: bold;" data-txt="footer-impressum-link">Impressum & Rechtliche Hinweise</a>
            <div style="margin-top: 15px; font-size: 11px;">&copy; 2026 ipscboerse.com – Alle Rechte vorbehalten.</div>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script src="lang.js"></script>
    <script src="app.js"></script>
    <script>
        let myMatches = [];

        function escapeHtml(text) { const div = document.createElement("div"); div.textContent = text; return div.innerHTML; }

        window.onAuthChange = (user) => {
            if (user) {
                document.getElementById('logged-out-section').style.display = 'none';
                document.getElementById('planner-section').style.display = 'block';
                loadMatchesFromSupabase();
            } else {
                document.getElementById('logged-out-section').style.display = 'block';
                document.getElementById('planner-section').style.display = 'none';
                document.getElementById('match-list').innerHTML = '';
            }
        };

        async function loadMatchesFromSupabase() {
            if (!window.currentUser) return;
            const { data, error } = await window.supabaseClient.from('user_matches').select('*').order('match_date', { ascending: true });
            if (error) { console.error("Fehler beim Laden:", error); return; }
            myMatches = data || [];
            renderMatches();
        }

        async function addMatch() {
            const name = document.getElementById('match-name').value.trim();
            const date = document.getElementById('match-date').value;
            const location = document.getElementById('match-location').value.trim();

            if (!name || !date) { alert("Match-Name und Datum sind Pflichtfelder."); return; }
            const { error = null } = await window.supabaseClient.from('user_matches').insert([{ user_id: window.currentUser.id, match_name: name, match_date: date, match_location: location }]);
            if (error) { alert("Fehler beim Speichern: " + error.message); return; }

            document.getElementById('match-name').value = '';
            document.getElementById('match-date').value = '';
            document.getElementById('match-location').value = '';
            loadMatchesFromSupabase();
        }

        async function deleteMatch(id) {
            const { error } = await window.supabaseClient.from('user_matches').delete().eq('id', id);
            if (!error) loadMatchesFromSupabase();
        }

        function renderMatches() {
            const container = document.getElementById('match-list');
            if (!container) return;
            container.innerHTML = '';

            if (myMatches.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); font-style: italic; font-weight: 600;" data-txt="planner-no-matches">Noch keine Matches eingetragen.</p>';
                return;
            }

            myMatches.forEach(match => {
                const dateObj = new Date(match.match_date);
                const displayDate = dateObj.toLocaleDateString('de-DE');
                const safeName = encodeURIComponent(match.match_name);
                const safeLocation = encodeURIComponent(match.match_location || '');
                
                let matchTitleHtml = escapeHtml(match.match_name);
                if (match.match_url) {
                    matchTitleHtml = `<a href="${escapeHtml(match.match_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(match.match_name)} 🔗</a>`;
                }

                let badgesHtml = '';
                if (match.auto_imported) {
                    badgesHtml += `<span class="badge badge-bot">🤖 Auto-Import</span>`;
                }

                if (match.status) {
                    const statusLower = match.status.toLowerCase();
                    if (statusLower.includes('approved') || statusLower.includes('bestätigt')) {
                        badgesHtml += `<span class="badge badge-approved">Approved</span>`;
                    } else if (statusLower.includes('warteliste') || statusLower.includes('waiting')) {
                        badgesHtml += `<span class="badge badge-warteliste">Warteliste</span>`;
                    } else {
                        badgesHtml += `<span class="badge badge-pending">${escapeHtml(match.status)}</span>`;
                    }
                }

                if (match.squad && match.squad !== 'TBD') {
                    badgesHtml += `<span class="badge badge-squad">${escapeHtml(match.squad)}</span>`;
                }

                // Inline-Styles für Inserieren-Button für Premium-Look leicht angepasst
                container.innerHTML += `
                    <div class="match-item">
                        <div>
                            <h4>${matchTitleHtml} ${badgesHtml}</h4>
                            <p>📅 ${displayDate} | 📍 ${escapeHtml(match.match_location || '-')}</p>
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap;">
                            <button onclick="inserierenAufMarktplatz('${safeName}', '${match.match_date}', '${safeLocation}')" style="background: var(--accent-gradient); color: #fff; border: none; border-radius: var(--radius); width: auto; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(255, 159, 67, 0.3);">📢 Inserieren</button>
                            <button onclick="deleteMatch(${match.id})" class="delete-btn">Löschen</button>
                        </div>
                    </div>
                `;
            });
        }
        
        function inserierenAufMarktplatz(name, date, location) {
            const params = new URLSearchParams({ from_planner: 'true', name: decodeURIComponent(name), date: date, location: decodeURIComponent(location) });
            window.location.href = 'marktplatz.html?' + params.toString();
        }

        function exportToCalendar() {
            if (myMatches.length === 0) { alert("Keine Matches zum Exportieren."); return; }
            let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//IPSC Boerse//Wettkampfplaner//DE\nCALSCALE:GREGORIAN\n";
            myMatches.forEach(match => {
                const dateStr = match.match_date.replace(/-/g, '');
                icsContent += "BEGIN:VEVENT\n";
                icsContent += `DTSTART;VALUE=DATE:${dateStr}\n`;
                const endDate = new Date(match.match_date);
                endDate.setDate(endDate.getDate() + 1);
                const endStr = endDate.toISOString().split('T')[0].replace(/-/g, '');
                icsContent += `DTEND;VALUE=DATE:${endStr}\n`;
                icsContent += `SUMMARY:${match.match_name}\n`;
                if(match.match_location) icsContent += `LOCATION:${match.match_location}\n`;
                icsContent += "DESCRIPTION:Wettkampf eingetragen über ipscboerse.com\n";
                icsContent += "END:VEVENT\n";
            });
            icsContent += "END:VCALENDAR";

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'meine_ipsc_matches.ics';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onLanguageChanged = () => { renderMatches(); };
    </script>
</body>
</html>
