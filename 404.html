<!DOCTYPE html>
<html>
<head>
    <script>
        // Wenn ein 404 auftritt, schaue, ob es ein Supabase-Link ist
        var path = window.location.pathname;
        var hash = window.location.hash;
        
        // Wenn ein Hash (wie #type=recovery) vorhanden ist,
        // leite auf die index.html mit diesem Hash weiter
        if (hash.includes("type=recovery")) {
            window.location.href = "index.html" + hash;
        } else {
            // Normale 404-Seite anzeigen oder auf Startseite
            document.write("Seite nicht gefunden. <a href='index.html'>Zurück zur Startseite</a>");
        }
    </script>
</head>
<body>
    <h1>Lade sicher...</h1>
</body>
</html>
