<!DOCTYPE html>
<html>
<head>

    <style id="native-dark-prepaint-v63">
      :root {
        background: #0f172a;
        color-scheme: dark;
      }
      html, body {
        min-height: 100%;
        background-color: #0f172a !important;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #f6f8fc !important;
        color-scheme: light;
      }
      html[data-theme="dark"], html[data-theme="dark"] body {
        background-color: #0f172a !important;
        color-scheme: dark;
      }
      #app-page-transition-cover {
        position: fixed !important;
        inset: -4px !important;
        z-index: 2147483647 !important;
        pointer-events: none !important;
        opacity: 0;
        background: #0f172a !important;
        transition: opacity 45ms linear !important;
        transform: translateZ(0);
        will-change: opacity;
      }
      html[data-theme="light"] #app-page-transition-cover {
        background: #f6f8fc !important;
      }
      html.is-page-leaving #app-page-transition-cover,
      html.is-page-entering #app-page-transition-cover {
        opacity: 1 !important;
      }
      html.is-page-leaving,
      html.is-page-entering {
        background-color: #0f172a !important;
      }
      html[data-theme="light"].is-page-leaving,
      html[data-theme="light"].is-page-entering {
        background-color: #f6f8fc !important;
      }
    </style>
    <script id="native-dark-prepaint-script-v63">
      (function () {
        var d = document.documentElement;
        var theme = "dark";
        try {
          var saved = localStorage.getItem("selectedTheme") || localStorage.getItem("theme") || "dark";
          if (saved === "auto") {
            saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (_) {}

        try {
          d.setAttribute("data-theme", theme);
          d.style.backgroundColor = theme === "dark" ? "#0f172a" : "#f6f8fc";
          d.style.colorScheme = theme === "dark" ? "dark" : "light";

          if (sessionStorage.getItem("ipscPageTransitionV63") === "1") {
            d.classList.add("is-page-entering");
          }
        } catch (_) {}
      })();
    </script>

    <script>
        // Diese Datei fängt den Supabase-Link ab und leitet sicher weiter
        window.location.href = "index.html" + window.location.hash;
    </script>
    <meta name="theme-color" content="#0f172a">
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("theme") || localStorage.getItem("selectedTheme") || "dark";
          if (savedTheme !== "light" && savedTheme !== "dark") savedTheme = "dark";
          document.documentElement.setAttribute("data-theme", savedTheme);
          document.documentElement.style.backgroundColor = savedTheme === "dark" ? "#0f172a" : "#f6f8fc";
          document.documentElement.style.colorScheme = savedTheme === "dark" ? "dark" : "light";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.style.backgroundColor = "#0f172a";
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <style id="app-prepaint-v49">
      html {
        min-height: 100%;
        background: #0f172a;
      }
      html[data-theme="light"] {
        background: #f6f8fc;
      }
      body {
        min-height: 100vh;
        background: #0f172a;
        overscroll-behavior: none;
      }
      html[data-theme="light"] body {
        background: #f6f8fc;
      }
      #main-header {
        background: inherit;
      }
    </style>


    <script id="theme-sync-v52">
      (function () {
        try {
          var selected = localStorage.getItem("selectedTheme");
          var legacy = localStorage.getItem("theme");
          var theme = selected || legacy || "light";

          if (theme === "auto") {
            theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }

          if (theme !== "light" && theme !== "dark") theme = "light";

          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.backgroundColor = theme === "dark" ? "#0f172a" : "#f6f8fc";
          document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";

          localStorage.setItem("selectedTheme", theme);
          localStorage.setItem("theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.style.backgroundColor = "#f6f8fc";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>

</head>
<body class="page-reset">
    <div id="app-page-transition-cover" aria-hidden="true"></div>
    <p>Verbindung zum Server wird hergestellt...</p>

    <script id="native-page-transition-script-v63">
      (function () {
        var KEY = "ipscPageTransitionV63";

        function currentTheme() {
          try {
            var saved = localStorage.getItem("selectedTheme") || localStorage.getItem("theme") || "dark";
            if (saved === "auto") {
              saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            return saved === "light" ? "light" : "dark";
          } catch (_) {
            return "dark";
          }
        }

        function ensureCover() {
          var cover = document.getElementById("app-page-transition-cover");
          if (!cover && document.body) {
            cover = document.createElement("div");
            cover.id = "app-page-transition-cover";
            cover.setAttribute("aria-hidden", "true");
            document.body.insertBefore(cover, document.body.firstChild);
          }
          return cover;
        }

        function markLeaving() {
          try {
            ensureCover();
            var theme = currentTheme();
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.style.backgroundColor = theme === "dark" ? "#0f172a" : "#f6f8fc";
            sessionStorage.setItem(KEY, "1");
            document.documentElement.classList.add("is-page-leaving");
          } catch (_) {}
        }

        function clearTransition() {
          try {
            ensureCover();
            var theme = currentTheme();
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.style.backgroundColor = theme === "dark" ? "#0f172a" : "#f6f8fc";

            setTimeout(function () {
              try {
                document.documentElement.classList.remove("is-page-entering");
                document.documentElement.classList.remove("is-page-leaving");
                sessionStorage.removeItem(KEY);
              } catch (_) {}
            }, 140);
          } catch (_) {}
        }

        function isInternalNavigationTarget(target) {
          var link = target && target.closest ? target.closest("a[href]") : null;
          if (!link) return false;

          if (link.target && link.target !== "_self") return false;
          if (link.hasAttribute("download")) return false;

          var href = link.getAttribute("href") || "";
          if (!href) return false;
          if (href.indexOf("#") === 0) return false;
          if (/^(javascript:|mailto:|tel:|sms:|blob:|data:)/i.test(href)) return false;

          try {
            var url = new URL(href, window.location.href);
            if (url.origin !== window.location.origin) return false;
            if (url.pathname === window.location.pathname && url.search === window.location.search && url.hash) return false;
            return true;
          } catch (_) {
            return false;
          }
        }

        window.showPageTransitionCover = markLeaving;

        document.addEventListener("DOMContentLoaded", function () {
          ensureCover();
          clearTransition();
        }, { once: true });

        window.addEventListener("load", clearTransition, { passive: true });
        window.addEventListener("pageshow", clearTransition, { passive: true });
        window.addEventListener("pagehide", markLeaving, { passive: true });
        window.addEventListener("beforeunload", markLeaving);

        document.addEventListener("click", function (event) {
          if (isInternalNavigationTarget(event.target)) {
            markLeaving();
          }
        }, true);
      })();
    </script>

</body>
</html>
