<!DOCTYPE html>
<html>
<head>
    <script>
        // Diese Datei fängt den Supabase-Link ab und leitet sicher weiter
        window.location.href = "index.html" + window.location.hash;
    </script>
    <meta name="theme-color" content="#0f172a">
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("theme") || localStorage.getItem("selectedTheme") || "dark";
          if (savedTheme !== "light" && savedTheme !== "dark") savedTheme = "dark";
          document.documentElement.setAttribute("data-theme", savedTheme);
          document.documentElement.style.backgroundColor = savedTheme === "dark" ? "#0f172a" : "#f6f8fc";
          document.documentElement.style.colorScheme = savedTheme === "dark" ? "dark" : "light";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.style.backgroundColor = "#0f172a";
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <style id="app-prepaint-v49">
      html {
        min-height: 100%;
        background: #0f172a;
      }
      html[data-theme="light"] {
        background: #f6f8fc;
      }
      body {
        min-height: 100vh;
        background: #0f172a;
        overscroll-behavior: none;
      }
      html[data-theme="light"] body {
        background: #f6f8fc;
      }
      #main-header {
        background: inherit;
      }
    </style>

    <style id="app-transition-prevent-flash-v50">
      html, body {
        background-color: #0f172a !important;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #f6f8fc !important;
      }
      #app-page-transition-cover {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        pointer-events: none;
        opacity: 0;
        background: #0f172a;
        transition: opacity 70ms linear;
      }
      html[data-theme="light"] #app-page-transition-cover {
        background: #f6f8fc;
      }
      html.is-page-leaving #app-page-transition-cover {
        opacity: 1;
      }
    </style>
    <script id="app-transition-script-v50">
      (function () {
        function markLeaving() {
          try { document.documentElement.classList.add("is-page-leaving"); } catch (_) {}
        }
        function clearLeaving() {
          try { document.documentElement.classList.remove("is-page-leaving"); } catch (_) {}
        }
        window.addEventListener("pageshow", clearLeaving, { passive: true });
        window.addEventListener("pagehide", markLeaving, { passive: true });
        window.addEventListener("beforeunload", markLeaving);
        document.addEventListener("click", function (event) {
          var target = event.target && event.target.closest ? event.target.closest("a[href]") : null;
          if (!target) return;
          if (target.target && target.target !== "_self") return;
          if (target.hasAttribute("download")) return;
          var href = target.getAttribute("href") || "";
          if (!href || href.indexOf("#") === 0 || href.indexOf("javascript:") === 0 || href.indexOf("mailto:") === 0 || href.indexOf("tel:") === 0) return;
          try {
            var url = new URL(href, window.location.href);
            if (url.origin !== window.location.origin) return;
            markLeaving();
          } catch (_) {}
        }, true);
      })();
    </script>


    <style id="app-transition-prevent-flash-v51">
      html, body { background-color: #0f172a !important; overscroll-behavior: none; }
      html[data-theme="light"], html[data-theme="light"] body { background-color: #f6f8fc !important; }
      #app-page-transition-cover { position: fixed !important; inset: 0 !important; z-index: 2147483000 !important; pointer-events: none !important; opacity: 0 !important; background: #0f172a !important; transition: opacity 25ms linear !important; transform: translateZ(0) !important; }
      html[data-theme="light"] #app-page-transition-cover { background: #f6f8fc !important; }
      html.is-page-leaving #app-page-transition-cover { opacity: 1 !important; }
    </style>
    <script id="app-transition-script-v51">
      (function () {
        function ensureCover() { try { if (!document.body) return; if (!document.getElementById("app-page-transition-cover")) { var cover = document.createElement("div"); cover.id = "app-page-transition-cover"; cover.setAttribute("aria-hidden", "true"); document.body.prepend(cover); } } catch (_) {} }
        function markLeaving() { ensureCover(); try { document.documentElement.classList.add("is-page-leaving"); } catch (_) {} }
        function clearLeaving() { try { document.documentElement.classList.remove("is-page-leaving"); } catch (_) {} ensureCover(); }
        window.showPageTransitionCover = markLeaving;
        window.addEventListener("pageshow", clearLeaving, { passive: true });
        window.addEventListener("pagehide", markLeaving, { passive: true });
        window.addEventListener("beforeunload", markLeaving);
        document.addEventListener("DOMContentLoaded", ensureCover, { once: true });
        document.addEventListener("click", function (event) { var target = event.target && event.target.closest ? event.target.closest("a[href]") : null; if (!target) return; if (target.target && target.target !== "_self") return; if (target.hasAttribute("download")) return; var href = target.getAttribute("href") || ""; if (!href || href.indexOf("#") === 0 || href.indexOf("javascript:") === 0 || href.indexOf("mailto:") === 0 || href.indexOf("tel:") === 0) return; try { var url = new URL(href, window.location.href); if (url.origin !== window.location.origin) return; markLeaving(); } catch (_) {} }, true);
      })();
    </script>


    <script id="theme-sync-v52">
      (function () {
        try {
          var selected = localStorage.getItem("selectedTheme");
          var legacy = localStorage.getItem("theme");
          var theme = selected || legacy || "light";

          if (theme === "auto") {
            theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }

          if (theme !== "light" && theme !== "dark") theme = "light";

          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.backgroundColor = theme === "dark" ? "#0f172a" : "#f6f8fc";
          document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";

          localStorage.setItem("selectedTheme", theme);
          localStorage.setItem("theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.style.backgroundColor = "#f6f8fc";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>

</head>
<body class="page-reset">
    <div id="app-page-transition-cover" aria-hidden="true"></div>
    <p>Verbindung zum Server wird hergestellt...</p>
</body>
</html>
