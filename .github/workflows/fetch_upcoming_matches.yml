name: IPSC Upcoming Matches Scraper

on:
  schedule:
    # Läuft jeden Tag um 02:30 Uhr (UTC)
    - cron: '30 2 * * *'
  workflow_dispatch: # Erlaubt es dir, das Skript jederzeit manuell in GitHub zu starten

jobs:
  update-upcoming:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bibliotheken installieren
      run: |
        python -m pip install --upgrade pip
        # Installiert alle benötigten Module für das Skript
        pip install requests beautifulsoup4 supabase

    - name: Scraper ausführen und in Datenbank schreiben
      env:
        # Hier werden die Schlüssel aus deinen GitHub-Secrets geladen
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: python fetch_upcoming_matches.py
