name: IPSC Upcoming Matches Scraper

on:
  schedule:
    # Läuft jeden Tag um 02:30 Uhr (UTC)
    - cron: '30 2 * * *'
  workflow_dispatch: # Erlaubt es dir, das Skript jederzeit manuell in GitHub zu starten

jobs:
  update-upcoming:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bibliotheken installieren
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Scraper ausführen
      run: python fetch_upcoming_matches.py

    - name: Änderungen committen und pushen
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add upcoming_matches.json
        # Das '|| echo' verhindert den Absturz (rotes X), falls die Datei identisch geblieben ist
        git commit -m "Update upcoming_matches.json" || echo "Keine Änderungen zum Committen"
        git push origin main || git push origin master
