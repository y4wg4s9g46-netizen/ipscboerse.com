name: Weekly IPSC ELO Scraper

on:
  schedule:
    # Läuft jeden Montag um 03:15 Uhr UTC (Nachts, wenn auf Servern wenig los ist)
    - cron: '15 3 * * 1'
  workflow_dispatch: # Erlaubt dir, das Skript bei Github auch manuell per Knopfdruck zu testen

jobs:
  scrape_and_upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v3

      - name: 🐍 Python installieren
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 supabase lxml

      - name: 🚀 Scraper ausführen
        run: python elo_scraper.py
