name: Weekly IPSC ELO Scraper

on:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch: 

jobs:
  scrape_and_upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Repository auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Pakete installieren
        # NEU: selenium und webdriver-manager hinzugefügt
        run: |
          python -m pip install --upgrade pip
          pip install pandas beautifulsoup4 supabase lxml html5lib selenium webdriver-manager

      - name: 🚀 Scraper ausführen
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python elo_scraper.py
