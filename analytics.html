<script>
// Diese Funktion startet die gesamte Abfrage-Pipeline
function startAnalyticsPipeline() {
    // 🔍 WICHTIG: Falls dein Supabase-Client in einem anderen Skript z.B. "const sb" heißt, 
    // musst du hier "window.sb" ergänzen!
    const client = window.supabaseClient || window.supabase;
    
    if (client) {
        initAnalytics(client);
    } else {
        let versucht = 0;
        const checkCtx = setInterval(() => {
            versucht++;
            const retryClient = window.supabaseClient || window.supabase;
            if (retryClient) {
                clearInterval(checkCtx);
                initAnalytics(retryClient);
            } else if (versucht > 15) {
                clearInterval(checkCtx);
                document.getElementById("analytics-loader").innerText = "❌ Supabase-Verbindung fehlgeschlagen. Variable prüfen!";
            }
        }, 200);
    }
}

// 🛡️ SICHERER START-CHECK (Exakt wie in deiner lang.js)
if (document.readyState === 'loading') {
    document.addEventListener("DOMContentLoaded", startAnalyticsPipeline);
} else {
    startAnalyticsPipeline(); // Seite ist schon fertig? Dann direkt starten!
}

async function initAnalytics(supabase) {
    try {
        // 1. Session prüfen
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
            document.getElementById("analytics-loader").innerText = "❌ Bitte logge dich ein, um deine Daten zu sehen.";
            return;
        }

        // 2. Daten laden
        const { data: stages, error } = await supabase
            .from('user_match_analytics')
            .select('*')
            .eq('user_id', session.user.id);

        if (error) throw error;

        if (!stages || stages.length === 0) {
            document.getElementById("analytics-loader").style.display = "none";
            document.getElementById("analytics-empty-state").style.display = "block";
            return;
        }

        // 3. Berechnungen
        const totalStages = stages.length;
        const uniqueMatches = [...new Set(stages.map(s => s.match_id))].length;
        
        let sumHitFactor = 0, totalA = 0, totalC = 0, totalD = 0, totalM = 0;

        stages.forEach(stage => {
            sumHitFactor += parseFloat(stage.hit_factor || 0);
            totalA += parseInt(stage.alphas || 0);
            totalC += parseInt(stage.charlies || 0);
            totalD += parseInt(stage.deltas || 0);
            totalM += parseInt(stage.misses || 0);
        });

        const avgHitFactor = (sumHitFactor / totalStages).toFixed(2);
        const totalHits = totalA + totalC + totalD;

        const aPerc = totalHits > 0 ? Math.round((totalA / totalHits) * 100) : 0;
        const cPerc = totalHits > 0 ? Math.round((totalC / totalHits) * 100) : 0;
        const dPerc = totalHits > 0 ? Math.round((totalD / totalHits) * 100) : 0;

        // 4. UI füllen
        document.getElementById("kpi-total-matches").innerText = uniqueMatches;
        document.getElementById("kpi-avg-hf").innerText = avgHitFactor;
        document.getElementById("count-alphas").innerText = totalA;
        document.getElementById("count-charlies").innerText = totalC;
        document.getElementById("count-deltas").innerText = totalD;
        document.getElementById("count-misses").innerText = totalM;

        document.getElementById("analytics-alpha-badge").innerText = `${aPerc}% Alphas`;
        document.getElementById("bar-alphas").style.width = `${aPerc}%`;
        document.getElementById("bar-charlies").style.width = `${cPerc}%`;
        document.getElementById("bar-deltas").style.width = `${dPerc}%`;

        // 5. Chart bauen
        const chartContainer = document.getElementById("analytics-chart-container");
        chartContainer.innerHTML = '';
        
        const lastFive = stages.slice(-5);
        const maxHF = Math.max(...lastFive.map(s => floatVal(s.hit_factor)), 1);

        lastFive.forEach((stage, i) => {
            const hf = floatVal(stage.hit_factor);
            const hPerc = (hf / maxHF) * 100;
            
            let bColor = '#3182ce'; // Blau
            if (parseInt(stage.misses) > 0) bColor = '#e53e3e'; // Rot bei Miss
            else if (hPerc > 80) bColor = '#38a169'; // Grün bei Topleistung

            const shortName = stage.stage_name.length > 7 ? stage.stage_name.substring(0, 6) + '..' : stage.stage_name;

            chartContainer.insertAdjacentHTML('beforeend', `
                <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end;">
                    <span style="font-size: 11px; font-weight: 700; color: #2d3748;">${hf.toFixed(2)}</span>
                    <div style="width: 100%; height: ${hPerc}%; background: ${bColor}; border-radius: 4px 4px 0 0; min-height: 4px;"></div>
                    <span style="font-size: 10px; color: #718096;">${shortName}</span>
                </div>
            `);
        });

        document.getElementById("analytics-loader").style.display = "none";
        document.getElementById("analytics-dashboard-content").style.display = "block";

    } catch (err) {
        console.error(err);
        document.getElementById("analytics-loader").innerText = "❌ Fehler beim Laden der echten Daten.";
    }
}
function floatVal(v) { return v ? parseFloat(v) : 0.0; }
</script>
