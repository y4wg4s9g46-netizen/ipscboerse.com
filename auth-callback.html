    <style id="native-page-transition-v74">
      #native-page-curtain-v74 {
        position: fixed;
        inset: 0;
        z-index: 2147483300;
        pointer-events: none;
        opacity: 0;
        background: #f6f8fc;
        transition: opacity 72ms ease;
        transform: translateZ(0);
        will-change: opacity;
      }
      html[data-theme="dark"] #native-page-curtain-v74 { background: #0f172a; }
      html.is-native-navigating-v74 #native-page-curtain-v74 { opacity: 1; }
      html.is-native-arriving-v74 body { opacity: 1; }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f6f8fc !important;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {

    <script id="native-page-transition-script-v74">
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem("selectedTheme") || localStorage.getItem("theme") || root.getAttribute("data-theme") || "light";
          if (theme === "auto") {
            theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (theme !== "dark") theme = "light";
          root.setAttribute("data-theme", theme);
          root.style.backgroundColor = theme === "dark" ? "#0f172a" : "#f6f8fc";
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0f172a" : "#f6f8fc");
          window.__IPSC_ACTIVE_THEME_V74 = theme;
          root.classList.add("is-native-arriving-v74");
          window.addEventListener("pageshow", function () {
            setTimeout(function () {
              root.classList.remove("is-native-arriving-v72", "is-native-navigating-v72", "is-native-arriving-v73", "is-native-navigating-v73", "is-native-arriving-v74", "is-native-navigating-v74");
            }, 48);
          });
        } catch (_) {}
      })();
    </script>

<style id="theme-prepaint-v70">

        transition: none !important;
        animation: none !important;
      }
    </style>
    <script id="theme-prepaint-script-v70">
      (function () {
        var theme = "light";
        try {
          var selected = localStorage.getItem("selectedTheme");
          var legacy = localStorage.getItem("theme");
          theme = selected || legacy || "light";
          if (theme === "auto") {
            theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (theme !== "light" && theme !== "dark") theme = "light";
        } catch (_) {
          theme = "light";
        }

        try {
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.style.backgroundColor = theme === "dark" ? "#0f172a" : "#f6f8fc";
          root.style.colorScheme = theme === "dark" ? "dark" : "light";
          window.__IPSC_ACTIVE_THEME_V70 = theme;

          try {
            localStorage.setItem("selectedTheme", theme);
            localStorage.setItem("theme", theme);
          } catch (_) {}

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0f172a" : "#f6f8fc");
        } catch (_) {}
      })();
    </script>

<body class="app-v71 app-v72 app-v73 app-v74 app-v75 app-v76 app-v76b app-v76c app-v76d app-v76e app-v76f app-v76h">
  <div class="box">

    <h1>Login wird abgeschlossen…</h1>
    <p>Du wirst automatisch zurück zur IPSC-Börse-App geleitet.</p>
    <p id="fallback" style="margin-top:14px;display:none;"><a id="fallback-link" href="#">App öffnen</a></p>

  <script>
    (function(){
      var appUrl = "ipscboerse://auth-callback" + (location.search || "") + (location.hash || "");
      var link = document.getElementById("fallback-link");
      if (link) link.href = appUrl;
      function openApp(){ try{ location.replace(appUrl); } catch(_){ location.href = appUrl; } }
      setTimeout(openApp, 80);
      setTimeout(function(){ var f=document.getElementById("fallback"); if(f) f.style.display="block"; }, 1400);
    })();
  </script>

<script id="native-app-experience-script-v74">
(function () {
  if (window.__IPSC_NATIVE_EXPERIENCE_V74) return;
  window.__IPSC_NATIVE_EXPERIENCE_V74 = true;

  function activeTheme() {
    var t = document.documentElement.getAttribute("data-theme") || window.__IPSC_ACTIVE_THEME_V74 || window.__IPSC_ACTIVE_THEME_V70 || "light";
    return t === "dark" ? "dark" : "light";
  }

  function ensureCurtain() {
    ["native-page-curtain-v72", "native-page-curtain-v73"].forEach(function(id){
      var old = document.getElementById(id);
      if (old && old.parentNode) old.parentNode.removeChild(old);
    });

    var curtain = document.getElementById("native-page-curtain-v74");
    if (!curtain) {
      curtain = document.createElement("div");
      curtain.id = "native-page-curtain-v74";
      document.body.appendChild(curtain);
    }
    curtain.style.background = activeTheme() === "dark" ? "#0f172a" : "#f6f8fc";
    return curtain;
  }

  function markLoaded() {
    document.documentElement.classList.remove("is-native-arriving-v72", "is-native-navigating-v72", "is-native-arriving-v73", "is-native-navigating-v73", "is-native-arriving-v74", "is-native-navigating-v74");
    ensureCurtain();
  }

  document.addEventListener("DOMContentLoaded", function () {
    markLoaded();

    document.addEventListener("click", function (event) {
      var a = event.target.closest && event.target.closest("a[href]");
      if (!a) return;

      var href = a.getAttribute("href") || "";
      if (!href || href.startsWith("#") || href.startsWith("mailto:") || href.startsWith("tel:") || href.startsWith("javascript:")) return;
      if (a.target && a.target !== "_self") return;
      if (a.hasAttribute("download")) return;

      var url;
      try { url = new URL(href, window.location.href); } catch (_) { return; }
      if (url.origin !== window.location.origin) return;
      if (url.pathname === window.location.pathname && url.search === window.location.search) return;

      event.preventDefault();
      ensureCurtain();
      document.documentElement.classList.add("is-native-navigating-v74");
      setTimeout(function () { window.location.href = url.href; }, 54);
    }, true);
  });

  window.addEventListener("pageshow", markLoaded);
})();
</script>
