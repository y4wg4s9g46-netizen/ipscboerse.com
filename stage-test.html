<div class="tool-section">
    <h2 data-txt="tools-split-title">⏱️ Split-Time Analysator (SG BLE Link)</h2>
    <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Kopple deinen SG Smart Shot Timer 2 direkt per Bluetooth, um deine Splits und Transitions in Echtzeit zu analysieren.</p>
    
    <button id="ble-connect-btn" class="btn-submit" style="background-color: var(--info-color); margin-bottom: 15px;" onclick="connectSGTimer()">
        🔵 SG Timer 2 via Bluetooth verbinden
    </button>
    
    <div id="timer-live-status" style="font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 20px; color: var(--text-muted);">
        Status: Nicht verbunden
    </div>

    <div id="session-stats-card" class="pf-dashboard-card" style="display: none; margin-bottom: 20px; background: rgba(15, 23, 42, 0.25);">
        <div style="display: flex; justify-content: space-between; width: 100%; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; font-size: 14px;">
            <span>Gesamtzeit: <strong id="ble-total-time" style="color: var(--accent-color);">0.00s</strong></span>
            <span>Schüsse: <strong id="ble-shot-count">0</strong></span>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; font-size: 12px; margin-top: 8px; text-align: left;">
            <div>Ø Split-Zeit: <strong id="ble-avg-split">0.00s</strong></div>
            <div>Langsamster Wechsel: <strong id="ble-slowest-transition" style="color: var(--danger-color);">0.00s</strong></div>
        </div>
    </div>

    <div style="overflow-x: auto;">
        <table class="leaderboard" id="ble-shot-table" style="display: none; font-size: 13px;">
            <thead>
                <tr>
                    <th style="width: 50px;">Schuss</th>
                    <th>Zeit (s)</th>
                    <th>Split (s)</th>
                    <th>Typ</th>
                </tr>
            </thead>
            <tbody id="ble-shot-body"></tbody>
        </table>
    </div>
</div>

<script>
    let bleDevice = null;
    let bluetoothSessionTimes = [];

    async function connectSGTimer() {
        const btn = document.getElementById('ble-connect-btn');
        const statusEl = document.getElementById('timer-live-status');
        
        if (!navigator.bluetooth) {
            alert("Dein Browser unterstützt kein Web Bluetooth. Bitte nutze Chrome/Samsung Internet (Android) oder einen BLE-fähigen Browser wie Bluefy auf iOS.");
            return;
        }

        try {
            statusEl.innerText = "Suche nach SG Timer...";
            statusEl.style.color = "var(--accent-color)";

            // Filtert gezielt nach Shooters Global Geräten über das BLE-Protokoll
            bleDevice = await navigator.bluetooth.requestDevice({
                filters: [
                    { namePrefix: 'SG Timer' },
                    { namePrefix: 'SG_' }
                ],
                optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb'] // Beispiel-Service-UUID aus dem SG v3.2 API Guide
            });

            statusEl.innerText = "Kopple mit " + bleDevice.name + "...";
            const server = await bleDevice.gatt.connect();
            
            statusEl.innerText = "✓ Verbunden mit " + bleDevice.name;
            statusEl.style.color = "var(--success-color)";
            btn.innerText = "🔴 Verbindung trennen";
            btn.style.backgroundColor = "var(--danger-color)";
            btn.setAttribute("onclick", "disconnectSGTimer()");

            // Hier wird im echten Betrieb das Notification-Event der SG-Charakteristik abonniert:
            // const service = await server.getPrimaryService('...');
            // const char = await service.getCharacteristic('...');
            // char.addEventListener('characteristicvaluechanged', (e) => parseSGData(e));
            
        } catch (error) {
            console.error(error);
            // BACKFALL-DEMO: Wenn kein echter Timer gekoppelt ist, simulieren wir die Datenkette für die Range
            statusEl.innerText = "Simulations-Modus aktiv (Kein Hardware-Timer gefunden)";
            statusEl.style.color = "var(--text-muted)";
            btn.innerText = "⏱️ Kette simulieren";
            btn.setAttribute("onclick", "simulateShotChain()");
        }
    }

    function disconnectSGTimer() {
        if (bleDevice && bleDevice.gatt.connected) {
            bleDevice.gatt.disconnect();
        }
        location.reload();
    }

    // SIMULATOR: Generiert eine realistische IPSC-Schusskette (z.B. 6 Schuss mit Magazinwechsel)
    function simulateShotChain() {
        bluetoothSessionTimes = [];
        document.getElementById('session-stats-card').style.display = 'flex';
        document.getElementById('ble-shot-table').style.display = 'table';
        
        // Realistische kumulierte Timer-Rohdaten (Sekunden ab Startsignal)
        const simulatedRawTimes = [0.85, 1.05, 1.28, 3.10, 3.32, 3.58]; 
        let currentShot = 0;

        const interval = setInterval(() => {
            if (currentShot >= simulatedRawTimes.length) {
                clearInterval(interval);
                return;
            }
            processNewShot(simulatedRawTimes[currentShot]);
            currentShot++;
        }, 400);
    }

    function processNewShot(timestamp) {
        bluetoothSessionTimes.push(timestamp);
        
        const tbody = document.getElementById('ble-shot-body');
        const count = bluetoothSessionTimes.length;
        
        let split = 0;
        let type = "First Shot";

        if (count > 1) {
            split = timestamp - bluetoothSessionTimes[count - 2];
            // IPSC-Logik: Ein Split unter 0.35s ist meistens ein Double-Tap auf dieselbe Scheibe. Alles darüber ein Stellungs-/Zielwechsel.
            type = split < 0.35 ? "🎯 Split" : "🏃 Transition";
        }

        // Tabellen-Zeile hinzufügen
        const row = document.createElement('tr');
        if (type === "🏃 Transition") row.style.backgroundColor = "rgba(59, 130, 246, 0.05)";
        row.innerHTML = `
            <td>#${count}</td>
            <td>${timestamp.toFixed(2)}s</td>
            <td>${count > 1 ? split.toFixed(2) + 's' : '-'}</td>
            <td style="font-weight:600; color:${type === '🎯 Split' ? 'var(--success-color)' : 'var(--info-color)'}">${type}</td>
        `;
        tbody.appendChild(row);

        // Dashboard aktualisieren
        document.getElementById('ble-shot-count').innerText = count;
        document.getElementById('ble-total-time').innerText = timestamp.toFixed(2) + 's';

        // Statistiken berechnen
        calculateSessionStats();
    }

    function calculateSessionStats() {
        if (bluetoothSessionTimes.length < 2) return;
        
        let totalSplits = 0;
        let splitCount = 0;
        let slowestTransition = 0;

        for (let i = 1; i < bluetoothSessionTimes.length; i++) {
            const diff = bluetoothSessionTimes[i] - bluetoothSessionTimes[i - 1];
            if (diff < 0.35) {
                totalSplits += diff;
                splitCount++;
            } else {
                if (diff > slowestTransition) slowestTransition = diff;
            }
        }

        if (splitCount > 0) {
            document.getElementById('ble-avg-split').innerText = (totalSplits / splitCount).toFixed(2) + 's';
        }
        if (slowestTransition > 0) {
            document.getElementById('ble-slowest-transition').innerText = slowestTransition.toFixed(2) + 's';
        }
    }
</script>
