<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPSC Stage-Planer Prototyp</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { margin-bottom: 10px; font-size: 1.2rem; }

        /* WICHTIG: Erlaubt dem Browser nicht, die Seite beim Zeichnen zu scrollen */
        #stageCanvas {
            touch-action: none; 
            border: 2px dashed #444;
            max-width: 100%;
            height: auto;
            background-color: #222;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 400px;
        }

        button, label {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .btn-upload { background-color: #007bff; color: white; }
        .btn-clear { background-color: #dc3545; color: white; }
        
        .color-picker {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .color-dot {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid transparent;
            padding: 0;
        }

        .color-dot.active {
            border-color: white;
            transform: scale(1.1);
        }

        input[type="file"] { display: none; }
        .canvas-container { width: 100%; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <h2>🎯 IPSC Stage Walkthrough-Planer</h2>

    <label class="btn-upload" for="imageLoader">📸 Stage-Foto aufnehmen</label>
    <input type="file" id="imageLoader" accept="image/*" capture="environment">

    <br>

    <div class="canvas-container">
        <canvas id="stageCanvas" width="300" height="400"></canvas>
    </div>

    <div class="controls">
        <div class="color-picker">
            <button class="color-dot active" data-color="#ff0055" style="background-color: #ff0055;"></button>
            <button class="color-dot" data-color="#0088ff" style="background-color: #0088ff;"></button>
            <button class="color-dot" data-color="#00ff66" style="background-color: #00ff66;"></button>
        </div>
        <button class="btn-clear" id="clearBtn">❌ Löschen</button>
    </div>

    <script>
        const canvas = document.getElementById('stageCanvas');
        const ctx = canvas.getContext('2d');
        const imageLoader = document.getElementById('imageLoader');
        const clearBtn = document.getElementById('clearBtn');
        const colorDots = document.querySelectorAll('.color-dot');

        let isDrawing = false;
        let currentColor = '#ff0055'; // Standard: Rot
        let currentImage = null;

        // 1. FOTO LADEN & AUF CANVAS ZEICHNEN
        imageLoader.addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    resizeAndDrawImage();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        });

        function resizeAndDrawImage() {
            if (!currentImage) return;

            // Auflösung für scharfe Linien auf Handys deckeln (z.B. max 1000px Breite)
            const maxDim = 1000;
            let width = currentImage.width;
            let height = currentImage.height;

            if (width > maxDim || height > maxDim) {
                if (width > height) {
                    height *= maxDim / width;
                    width = maxDim;
                } else {
                    width *= maxDim / height;
                    height = maxDim;
                }
            }

            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(currentImage, 0, 0, width, height);
        }

        // 2. KOORDINATEN RECHNEN (für Skalierung wichtig!)
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            // Schaut ob es ein Touch-Event (Handy) oder Mouse-Event (PC) ist
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            // Rechnet die CSS-Größe exakt auf die interne Canvas-Auflösung um
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        // 3. ZEICHEN-LOGIK (Touch & Maus)
        function startDrawing(e) {
            isDrawing = true;
            const coords = getCoordinates(e);
            ctx.beginPath();
            ctx.moveTo(coords.x, coords.y);
            
            // Schickere Linienenden
            ctx.lineWidth = canvas.width / 100; // Dynamische Dicke je nach Bildgröße
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = currentColor;
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault(); // Verhindert Ruckeln auf manchen Androids
            const coords = getCoordinates(e);
            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.closePath();
        }

        // Event-Listener für Touch (Smartphone)
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        // Event-Listener für Maus (PC-Test)
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        // 4. CONTROLS (Farben & Reset)
        colorDots.forEach(dot => {
            dot.addEventListener('click', (e) => {
                document.querySelector('.color-dot.active').classList.remove('active');
                e.target.classList.add('active');
                currentColor = e.target.getAttribute('data-color');
            });
        });

        clearBtn.addEventListener('click', () => {
            if (currentImage) {
                // Wenn ein Bild geladen ist, zeichne es einfach sauber neu
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });
    </script>
</body>
</html>
