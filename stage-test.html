<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Planer | Startplatz Börse</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IPSC Börse">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Verwendet exakt dein bestehendes Farb- und Modisystem */
        :root, html[data-theme="light"] {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --accent-color: #ff9f43; /* IPSC Orange */
            --danger-color: #ef4444;
            --success-color: #10b981;
            --info-color: #3b82f6;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --radius: 8px;
        }

        html[data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
        }

        @media (prefers-color-scheme: dark) {
            html:not([data-theme="light"]) {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-color: #f8fafc;
                --text-muted: #94a3b8;
                --border-color: #334155;
                --input-bg: #0f172a;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; flex: 1; width: 100%; box-sizing: border-box; }

        .info-box {
            background-color: rgba(255, 159, 67, 0.08);
            border-left: 4px solid var(--accent-color);
            color: var(--text-color); padding: 15px; margin-bottom: 30px; border-radius: var(--radius);
            font-size: 14px; line-height: 1.5; border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-color);
        }

        .form-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius); padding: 25px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
        }

        .form-section h2 { margin-top: 0; font-size: 20px; font-weight: 700; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

        /* Integrierter Upload-Button im Stil des Marktplatzes */
        .btn-upload {
            background-color: var(--info-color);
            color: white; padding: 12px; border-radius: var(--radius);
            font-weight: 600; text-align: center; cursor: pointer;
            display: block; margin-bottom: 20px; box-shadow: var(--shadow-sm);
        }
        input[type="file"] { display: none; }

        /* --- INTERAKTIVER CANVAS / GRID BEREICH --- */
        .stage-wrapper {
            position: relative; width: 100%; display: flex; justify-content: center; margin-bottom: 25px;
        }

        .stage-view {
            position: relative; border: 1px solid var(--border-color);
            border-radius: var(--radius); overflow: hidden;
            box-shadow: var(--shadow-md); background: var(--input-bg);
            max-width: 100%;
        }

        #stage-image { display: block; max-width: 100%; height: auto; }

        /* Das digitale 2D-Strategieraster */
        #grid-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; grid-template-columns: repeat(16, 1fr); grid-template-rows: repeat(16, 1fr);
            cursor: crosshair; z-index: 3;
        }

        .grid-cell {
            border: 1px solid rgba(148, 163, 184, 0.15); box-sizing: border-box;
        }
        .grid-cell:hover { background-color: rgba(255, 159, 67, 0.15); }

        /* Vektorebene für die automatischen Laufwege */
        #path-svg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        /* Taktische Marker-Anzeige */
        .marker {
            position: absolute; transform: translate(-50%, -50%);
            width: 28px; height: 28px; font-weight: 800; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; user-select: none; pointer-events: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4); z-index: 2;
            border: 2px solid #ffffff; color: #ffffff;
        }
        .marker-x { background-color: var(--danger-color); }
        .marker-r { background-color: #eab308; } /* Warn-Gelb für Reloads */

        /* Nummerierung für die Chronologie des Laufwegs */
        .marker-index {
            position: absolute; top: -6px; right: -6px; background: #000;
            color: #fff; font-size: 9px; width: 14px; height: 14px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            border: 1px solid #fff;
        }

        /* --- STEUERUNGSBAR --- */
        .toolbar {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            padding: 12px; border-radius: var(--radius); display: flex; gap: 10px;
            box-shadow: var(--shadow-sm); margin-bottom: 30px;
        }

        .btn-tool {
            flex: 1; background-color: var(--bg-color); border: 1px solid var(--border-color);
            color: var(--text-color); padding: 10px; border-radius: 6px;
            font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.15s;
        }
        .btn-tool.active {
            background-color: var(--accent-color); color: #ffffff; border-color: var(--accent-color);
        }
        .btn-clear { background-color: rgba(239, 68, 68, 0.1); color: var(--danger-color); border: none; }
        .btn-clear:hover { background-color: var(--danger-color); color: white; }

        footer { background-color: var(--card-bg); border-top: 1px solid var(--border-color); padding: 30px 20px; margin-top: auto; font-size: 13px; color: var(--text-muted); text-align: center; }

        @media (max-width: 768px) {
            .container { padding: 0 10px; margin-top: 15px; }
            .toolbar { flex-direction: column; gap: 8px; }
            .btn-tool { width: 100%; }
        }
    </style>
</head>
<body>

    <header></header>
    <script src="header.js"></script>

    <div class="container">
        
        <div class="info-box" id="stage-info-box" data-txt="stage-desc">
            Lade einen Stage-Plan (Foto oder E-Mail-Anhang) hoch. Setze präzise Standpunkte (X) und Reloads (R) über das digitale Raster. Ein sauberer Laufweg wird automatisch gezeichnet.
        </div>

        <div class="form-section">
            <h2 data-txt="stage-title">🎯 Interaktiver Stage-Walkthrough Planer</h2>
            
            <label class="btn-upload" for="imageLoader" data-txt="stage-load">
                📂 Plan laden / Foto machen
            </label>
            <input type="file" id="imageLoader" accept="image/*">

            <div class="stage-wrapper">
                <div class="stage-view" id="stageView" style="display:none;">
                    <svg id="path-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <path id="walkway-path" d="" fill="none" stroke="#3b82f6" stroke-width="0.6" stroke-dasharray="1.5" vector-effect="non-scaling-stroke"/>
                    </svg>
                    
                    <img id="stage-image" src="" alt="Stage Plan">
                    
                    <div id="grid-overlay"></div>
                    
                    <div id="markers-layer"></div>
                </div>
            </div>

            <div class="toolbar" id="planner-tools" style="display:none;">
                <button class="btn-tool active" data-action="set-x" data-txt="tool-x">❌ Standpunkt (X)</button>
                <button class="btn-tool" data-action="set-r" data-txt="tool-r">🔄 Reload (R)</button>
                <button class="btn-tool btn-clear" id="btn-reset" data-txt="btn-reset-stage">🗑️ Plan zurücksetzen</button>
            </div>
        </div>
    </div>

    <footer>
        <div style="max-width: 1000px; margin: 0 auto; text-align: center;">
            <a href="/impressum.html" style="color: var(--info-color); text-decoration: none; font-weight: bold;" data-txt="footer-impressum-link">Impressum & Rechtliche Hinweise</a>
            <div style="margin-top: 15px; font-size: 11px;">&copy; 2026 ipscboerse.com – Alle Rechte vorbehalten.</div>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script src="lang.js"></script>
    <script src="app.js"></script>

    <script>
        const GRID_SIZE = 16; // Kompakteres 16x16 Gitter für bessere Bedienbarkeit am Handy
        const imageLoader = document.getElementById('imageLoader');
        const stageView = document.getElementById('stageView');
        const stageImage = document.getElementById('stage-image');
        const gridOverlay = document.getElementById('grid-overlay');
        const markersLayer = document.getElementById('markers-layer');
        const toolbar = document.getElementById('planner-tools');
        const walkwayPath = document.getElementById('walkway-path');
        const resetBtn = document.getElementById('btn-reset');

        let currentAction = 'set-x';
        let placedMarkers = []; // Hält die Chronologie der Wegpunkte fest

        // 1. DYNAMISCHES ERWEITERN DEINES TRANSLATION-SYSTEMS (lang.js Kompatibilität)
        if (window.portalTranslations) {
            const extensions = {
                de: {
                    "stage-title": "🎯 Interaktiver Stage-Walkthrough Planer",
                    "stage-desc": "Lade einen Stage-Plan (Foto oder E-Mail-Anhang) hoch. Setze präzise Standpunkte (X) und Reloads (R) über das digitale Raster. Ein sauberer Laufweg wird automatisch gezeichnet.",
                    "stage-load": "📂 Plan laden / Foto machen",
                    "tool-x": "❌ Standpunkt (X)",
                    "tool-r": "🔄 Reload (R)",
                    "btn-reset-stage": "🗑️ Plan zurücksetzen"
                },
                en: {
                    "stage-title": "🎯 Interactive Stage Walkthrough Planner",
                    "stage-desc": "Upload a stage plan (photo or email attachment). Place precise standing positions (X) and reloads (R) via the digital grid. A clean path is drawn automatically.",
                    "stage-load": "📂 Load Plan / Take Photo",
                    "tool-x": "❌ Position (X)",
                    "tool-r": "🔄 Reload (R)",
                    "btn-reset-stage": "🗑️ Reset Plan"
                }
            };
            Object.assign(window.portalTranslations.de, extensions.de);
            Object.assign(window.portalTranslations.en, extensions.en);
        }

        // 2. THEME COMPATIBILITY
        document.addEventListener("DOMContentLoaded", () => {
            const savedThemeSetting = localStorage.getItem("selectedTheme") || "auto";
            if (typeof updateThemeToggleIcon === "function") {
                updateThemeToggleIcon(savedThemeSetting);
            }
            if(typeof translatePortalPage === "function") {
                translatePortalPage();
            }
        });

        // 3. IMAGE UPLOAD & GRID INITIALISIERUNG
        imageLoader.addEventListener('change', function(e) {
            if(!e.target.files.length) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                stageImage.onload = function() {
                    initGrid();
                    stageView.style.display = 'block';
                    toolbar.style.display = 'flex';
                    resetPlanner();
                }
                stageImage.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        });

        function initGrid() {
            gridOverlay.innerHTML = '';
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.classList.add('grid-cell');
                    // Berechnet die Prozent-Koordinaten für die responsive SVG-Linie
                    cell.dataset.pctX = ((col + 0.5) / GRID_SIZE) * 100;
                    cell.dataset.pctY = ((row + 0.5) / GRID_SIZE) * 100;
                    cell.addEventListener('click', handleGridClick);
                    gridOverlay.appendChild(cell);
                }
            }
        }

        // 4. WORKFLOW LOGIK (MARKER SETZEN & PFAD ZEICHNEN)
        function handleGridClick(e) {
            const cell = e.target;
            const pctX = parseFloat(cell.dataset.pctX);
            const pctY = parseFloat(cell.dataset.pctY);

            // Neuen Punkt generieren
            const type = currentAction === 'set-x' ? 'X' : 'R';
            const markerData = { type, pctX, pctY };
            
            placedMarkers.push(markerData);
            renderMarkersAndPaths();
        }

        function renderMarkersAndPaths() {
            markersLayer.innerHTML = '';
            let pathD = '';

            placedMarkers.forEach((marker, index) => {
                // HTML Pin erzeugen
                const pin = document.createElement('div');
                pin.classList.add('marker', marker.type === 'X' ? 'marker-x' : 'marker-r');
                pin.style.left = `${marker.pctX}%`;
                pin.style.top = `${marker.pctY}%`;
                pin.textContent = marker.type;

                // Chronologische Nummerierung oben rechts am Pin anheften
                const indexBadge = document.createElement('div');
                indexBadge.classList.add('marker-index');
                indexBadge.textContent = index + 1;
                pin.appendChild(indexBadge);

                markersLayer.appendChild(pin);

                // SVG-Pfad-String zusammenbauen
                if (index === 0) {
                    pathD += `M ${marker.pctX} ${marker.pctY}`;
                } else {
                    pathD += ` L ${marker.pctX} ${marker.pctY}`;
                }
            });

            walkwayPath.setAttribute('d', pathD);
        }

        // 5. CONTROLS (Toolbar & Reset)
        toolbar.addEventListener('click', (e) => {
            const btn = e.target.closest('.btn-tool');
            if (!btn || btn.id === 'btn-reset') return;

            document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentAction = btn.getAttribute('data-action');
        });

        function resetPlanner() {
            placedMarkers = [];
            markersLayer.innerHTML = '';
            walkwayPath.setAttribute('d', '');
        }

        resetBtn.addEventListener('click', resetPlanner);

        window.onLanguageChanged = () => {
            const selector = document.getElementById("language-select");
            if (selector) selector.value = window.currentLang;
        };
    </script>
</body>
</html>
