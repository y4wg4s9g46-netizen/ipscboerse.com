  <script id="ipsc-v78-theme-prepaint">
    (function(){
      try {
        var theme = localStorage.getItem('selectedTheme') || localStorage.getItem('theme') || localStorage.getItem('ipsc_effective_theme') || 'light';
        if (theme === 'auto') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        theme = theme === 'dark' ? 'dark' : 'light';
        var bg = theme === 'dark' ? '#0f172a' : '#f6f8fc';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.colorScheme = theme;
        localStorage.setItem('ipsc_effective_theme', theme);
      } catch (_) {}
    })();
  </script>
