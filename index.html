<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPSC Match-Marktplatz | Startplatz Börse</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --bg-color: #1a1a1a; --card-bg: #2d2d2d; --accent-color: #ff9f43; --success-color: #2ecc71; --text-color: #ffffff; --text-muted: #aaaaaa; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #0f0f0f; padding: 20px; text-align: center; border-bottom: 3px solid var(--accent-color); }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; flex: 1; }
        .form-section { background-color: var(--card-bg); border: 1px solid #444; border-radius: 6px; padding: 25px; margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        input { background-color: #1a1a1a; border: 1px solid #555; color: #fff; padding: 10px; border-radius: 4px; }
        .btn-submit { background-color: var(--accent-color); color: #000; border: none; padding: 12px 30px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .btn-auth { background-color: transparent; color: var(--accent-color); border: 1px solid var(--accent-color); padding: 5px 15px; cursor: pointer; border-radius: 4px; }
        .toggle-group { display: flex; gap: 20px; margin-bottom: 20px; padding: 10px; background: #222; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>IPSC STARTPLATZ-BÖRSE</h1>
        <div id="auth-status-container" style="text-align: right; padding: 10px;"></div>
    </header>

    <div class="container">
        <div class="form-section">
            <h2>Eintrag erstellen</h2>
            <form id="match-form">
                <div class="toggle-group">
                    <label><input type="radio" name="ad-type" value="offer" checked> Biete Startplatz</label>
                    <label><input type="radio" name="ad-type" value="want"> Suche Startplatz</label>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Name des Matches *</label>
                        <input type="text" id="match-name" required>
                    </div>
                    <div class="form-group">
                        <label>Deine E-Mail *</label>
                        <input type="email" id="seller-email" required readonly>
                    </div>
                    <div class="form-group">
                        <label>Ort *</label>
                        <input type="text" id="match-location" required>
                    </div>
                    <div class="form-group">
                        <label>Preis (€) *</label>
                        <input type="number" id="match-price" required>
                    </div>
                    <div class="form-group">
                        <label>Level (z.B. L1, L2) *</label>
                        <input type="text" id="match-level" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Eintrag veröffentlichen</button>
            </form>
        </div>

        <h2>Aktuelle Marktplatz-Einträge</h2>
        <div id="match-container"></div>
    </div>

    <div id="auth-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:999;">
        <div style="background:#2d2d2d; padding:30px; border-radius:6px; width:300px; border: 1px solid #ff9f43;">
            <form id="login-form">
                <h3 style="color:#ff9f43; margin-top:0;">Login</h3>
                <input type="email" id="login-email" placeholder="E-Mail" required style="width:100%; margin-bottom:15px; box-sizing:border-box;">
                <input type="password" id="login-password" placeholder="Passwort" required style="width:100%; margin-bottom:15px; box-sizing:border-box;">
                <button type="submit" class="btn-submit" style="width:100%;">Einloggen</button>
            </form>
            <button onclick="document.getElementById('auth-modal').style.display='none'" style="background:none; border:none; color:#aaa; margin-top:15px; cursor:pointer;">Schließen</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
