<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPSC Match-Marktplatz | Startplatz Börse</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-color: #ff9f43;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --danger-color: #ff4d4d;
            --success-color: #2ecc71;
            --info-color: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #0f0f0f;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid var(--accent-color);
            position: relative;
        }

        header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }

        .header-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .header-controls { position: static; justify-content: center; margin-top: 15px; flex-direction: column; gap: 10px; }
        }

        .lang-switch {
            background-color: #1a1a1a; color: #fff; border: 1px solid #555;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .lang-switch:focus { outline: none; border-color: var(--accent-color); }

        .btn-auth {
            background-color: transparent; color: var(--accent-color); border: 2px solid var(--accent-color);
            padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer;
        }

        .btn-auth:hover { background-color: var(--accent-color); color: #000; }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; flex: 1; }

        .info-box {
            background-color: rgba(255, 159, 67, 0.1); border-left: 4px solid var(--accent-color);
            padding: 15px; margin-bottom: 30px; border-radius: 4px;
        }

        .form-section {
            background-color: var(--card-bg); border: 1px solid #444;
            border-radius: 6px; padding: 25px; margin-bottom: 40px;
        }

        .form-section h2 { margin-top: 0; color: var(--accent-color); border-bottom: 1px solid #444; padding-bottom: 10px; }

        .toggle-selector {
            display: flex; gap: 20px; margin-bottom: 20px; background: #1a1a1a; padding: 12px; border-radius: 4px; border: 1px solid #444;
        }

        .toggle-selector label {
            display: flex; align-items: center; gap: 8px; color: #fff; cursor: pointer; margin: 0; font-size: 14px;
        }

        .toggle-selector input { accent-color: var(--accent-color); cursor: pointer; }

        .filter-bar {
            background-color: #0f0f0f; border: 1px solid #444; padding: 15px; border-radius: 6px;
            margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center;
        }

        .filter-group { display: flex; align-items: center; gap: 10px; }
        .filter-group label { margin: 0; color: #fff; white-space: nowrap; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg); padding: 30px; border-radius: 6px;
            border: 1px solid var(--accent-color); width: 100%; max-width: 400px; box-sizing: border-box;
        }

        .modal-content h3 { color: var(--accent-color); margin-top: 0; }
        .modal-content .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .modal-content input { background-color: #1a1a1a; border: 1px solid #555; color: #fff; padding: 10px; border-radius: 4px; }
        .modal-footer { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .modal-footer a { color: var(--accent-color); text-decoration: none; cursor: pointer; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }

        .form-group { display: flex; flex-direction: column; }
        label { font-size: 14px; margin-bottom: 8px; color: var(--text-muted); font-weight: bold; }

        input, select {
            background-color: #1a1a1a; border: 1px solid #555; color: var(--text-color);
            padding: 10px; border-radius: 4px; font-size: 15px;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent-color); }

        .btn-submit {
            background-color: var(--accent-color); color: #000; border: none;
            padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 4px;
            cursor: pointer; margin-top: 10px;
        }
        .btn-submit:hover { background-color: #e08b35; }

        .match-list { display: flex; flex-direction: column; gap: 15px; }

        .match-card {
            background-color: var(--card-bg); border-radius: 6px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #444;
            position: relative; overflow: hidden;
        }

        .match-card::before {
            content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 5px;
        }
        .card-offer::before { background-color: var(--accent-color); }
        .card-want::before { background-color: var(--success-color); }

        .match-details h3 { margin: 0 0 5px 0; color: var(--accent-color); display: flex; align-items: center; gap: 10px; }
        .match-details p { margin: 5px 0; font-size: 14px; color: var(--text-muted); }
        
        .badge-container { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
        .badge { background-color: #444; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #fff; }

        .card-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

        .btn-contact {
            background-color: var(--accent-color); color: #000; border: none;
            padding: 10px 20px; font-weight: bold; border-radius: 4px; text-decoration: none; text-align: center;
        }
        .btn-contact:hover { opacity: 0.9; }

        .btn-delete {
            background-color: transparent; color: var(--danger-color); border: 1px solid var(--danger-color);
            padding: 5px 12px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer;
            margin-top: 5px;
        }
        .btn-delete:hover { background-color: var(--danger-color); color: #fff; }

        footer {
            background-color: #0f0f0f;
            border-top: 1px solid #444;
            padding: 30px 20px;
            margin-top: 50px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
        }
    </style>
</head>
<body>

    <header>
        <h1>IPSC STARTPLATZ-BÖRSE</h1>
        <div class="header-controls">
            <select id="language-select" class="lang-switch">
                <option value="de">DE</option>
                <option value="en">EN</option>
            </select>
            <div id="auth-status-container">
                <button class="btn-auth" id="btn-open-login">Login / Registrieren</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="form-section">
            <h2>Eintrag erstellen</h2>
            <div class="toggle-selector">
                <label><input type="radio" name="ad-type" id="type-offer" value="offer" checked> <span>Ich BIETE einen Startplatz an</span></label>
                <label><input type="radio" name="ad-type" id="type-want" value="want"> <span>Ich SUCHE einen Startplatz</span></label>
            </div>
            <form id="match-form">
                <div class="form-grid">
                    <div class="form-group"><label>Name des Matches *</label><input type="text" id="match-name" required></div>
                    <div class="form-group"><label>Match Level *</label><select id="match-level" required></select></div>
                    <div class="form-group"><label>Datum *</label><input type="date" id="match-date" required></div>
                    <div class="form-group"><label>Ort *</label><input type="text" id="match-location" required></div>
                    <div class="form-group"><label>Preis (€) *</label><input type="number" id="match-price" required></div>
                    <div class="form-group"><label>E-Mail *</label><input type="email" id="seller-email" required readonly></div>
                </div>
                <button type="submit" class="btn-submit">Eintrag veröffentlichen</button>
            </form>
        </div>

        <div class="match-list" id="match-container
