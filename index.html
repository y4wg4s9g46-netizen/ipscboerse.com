<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPSC Match-Marktplatz | Startplatz Börse</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-color: #ff9f43;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --danger-color: #ff4d4d;
            --success-color: #2ecc71;
            --info-color: #3498db;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #0f0f0f; padding: 20px; text-align: center; border-bottom: 3px solid var(--accent-color); position: relative; }
        header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
        .header-controls { position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 15px; }
        .btn-auth { background-color: transparent; color: var(--accent-color); border: 2px solid var(--accent-color); padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-auth:hover { background-color: var(--accent-color); color: #000; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; flex: 1; }
        .form-section { background-color: var(--card-bg); border: 1px solid #444; border-radius: 6px; padding: 25px; margin-bottom: 40px; }
        .form-section h2 { margin-top: 0; color: var(--accent-color); border-bottom: 1px solid #444; padding-bottom: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background-color: var(--card-bg); padding: 30px; border-radius: 6px; border: 1px solid var(--accent-color); width: 100%; max-width: 400px; }
        .modal-content h3 { color: var(--accent-color); margin-top: 0; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        input, select { background-color: #1a1a1a; border: 1px solid #555; color: #fff; padding: 10px; border-radius: 4px; }
        .btn-submit { background-color: var(--accent-color); color: #000; border: none; padding: 12px 30px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .match-card { background-color: var(--card-bg); border-radius: 6px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #444; }
        .badge { background-color: #444; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #fff; }
        .badge-type { background-color: rgba(255, 159, 67, 0.2); color: var(--accent-color); border: 1px solid var(--accent-color); }
        .btn-contact { background-color: var(--accent-color); color: #000; padding: 10px 20px; font-weight: bold; border-radius: 4px; text-decoration: none; }
        .btn-delete { background-color: transparent; color: var(--danger-color); border: 1px solid var(--danger-color); padding: 5px 12px; cursor: pointer; border-radius: 4px; margin-top: 5px; }
        .toggle-selector { display: flex; gap: 20px; margin-bottom: 20px; background: #1a1a1a; padding: 12px; border-radius: 4px; border: 1px solid #444; }
    </style>
</head>
<body>

    <header>
        <h1>IPSC STARTPLATZ-BÖRSE</h1>
        <div class="header-controls">
            <div id="auth-status-container">
                <button class="btn-auth" id="btn-open-login">Login / Registrieren</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="form-section">
            <h2>Eintrag erstellen</h2>
            <div class="toggle-selector">
                <label><input type="radio" name="ad-type" id="type-offer" value="offer" checked> BIETE</label>
                <label><input type="radio" name="ad-type" id="type-want" value="want"> SUCHE</label>
            </div>
            <form id="match-form">
                <div class="form-group"><label>Name des Matches *</label><input type="text" id="match-name" required></div>
                <div class="form-group"><label>Match Level *</label><select id="match-level" required></select></div>
                <div class="form-group"><label>Datum des Matches *</label><input type="date" id="match-date" required></div>
                <div class="form-group"><label>Austragungsort *</label><input type="text" id="match-location" required></div>
                <div class="form-group"><label>Preis (€) *</label><input type="number" id="match-price" required></div>
                <div class="form-group"><label>Deine E-Mail *</label><input type="email" id="seller-email" required readonly></div>
                <button type="submit" class="btn-submit">Eintrag veröffentlichen</button>
            </form>
        </div>

        <h2>Aktuelle Marktplatz-Einträge</h2>
        <div id="match-container"></div>
    </div>

    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <div style="text-align: right;"><span style="cursor:pointer; font-size: 20px;" id="btn-close-modal">&times;</span></div>
            
            <div id="modal-login-view">
                <h3>Anmelden</h3>
                <form id="login-form">
                    <div class="form-group"><label>E-Mail *</label><input type="email" id="login-email" required></div>
                    <div class="form-group"><label>Passwort *</label><input type="password" id="login-password" required></div>
                    <a href="#" id="btn-forgot-password" style="color: #ff9f43; font-size: 12px; display: block; margin-bottom: 10px; cursor: pointer;">Passwort vergessen?</a>
                    <button type="submit" class="btn-submit" style="width:100%;">Einloggen</button>
                </form>
                <div style="margin-top:20px;">Noch kein Konto? <a onclick="toggleAuthView(false)" style="color:var(--accent-color); cursor:pointer;">Registrieren</a></div>
            </div>

            <div id="modal-register-view" style="display: none;">
                <h3>Konto erstellen</h3>
                <form id="register-form">
                    <div class="form-group"><label>E-Mail *</label><input type="email" id="register-email" required></div>
                    <div class="form-group"><label>Passwort *</label><input type="password" id="register-password" required></div>
                    <button type="submit" class="btn-submit" style="width:100%;">Konto erstellen</button>
                </form>
                <div style="margin-top:20px;">Bereits registriert? <a onclick="toggleAuthView(true)" style="color:var(--accent-color); cursor:pointer;">Zum Login</a></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
