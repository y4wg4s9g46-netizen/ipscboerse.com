<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPSC Match-Marktplatz | Startplatz Börse</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #1a1a1a; --card-bg: #2d2d2d; --accent-color: #ff9f43; --text-color: #ffffff; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 6px; border: 1px solid var(--accent-color); width: 100%; max-width: 400px; }
        .btn-submit { background-color: var(--accent-color); color: #000; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 4px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; background: #1a1a1a; border: 1px solid #555; color: #fff; }
        .btn-auth { background: transparent; color: var(--accent-color); border: 2px solid var(--accent-color); padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>IPSC Marktplatz</h1>
    <div id="auth-status-container"></div>

    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <span id="btn-close-modal" style="cursor:pointer; float:right;">&times;</span>
            
            <div id="modal-login-view">
                <h3>Anmelden</h3>
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="E-Mail" required>
                    <input type="password" id="login-password" placeholder="Passwort" required>
                    <button type="submit" class="btn-submit">Einloggen</button>
                </form>
                <div style="margin-top: 15px;">Noch kein Konto? <a href="#" onclick="toggleAuthView(false)">Registrieren</a></div>
            </div>

            <div id="modal-register-view" style="display: none;">
                <h3>Konto erstellen</h3>
                <form id="register-form">
                    <input type="email" id="register-email" placeholder="E-Mail" required>
                    <input type="password" id="register-password" placeholder="Passwort" required minlength="6">
                    <button type="submit" class="btn-submit">Konto erstellen</button>
                </form>
                <div style="margin-top: 15px;">Bereits registriert? <a href="#" onclick="toggleAuthView(true)">Zum Login</a></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
