<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPSC Match-Marktplatz | Startplatz Börse</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-color: #ff9f43;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --danger-color: #ff4d4d;
            --success-color: #2ecc71;
            --info-color: #3498db;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #0f0f0f; padding: 20px; text-align: center; border-bottom: 3px solid var(--accent-color); position: relative; }
        header h1 { margin: 0; font-size: 24px; letter-spacing: 1px; }
        .header-controls { position: absolute; top: 20px; right: 20px; display: flex; align-items: center; gap: 15px; }
        .btn-auth { background-color: transparent; color: var(--accent-color); border: 2px solid var(--accent-color); padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-auth:hover { background-color: var(--accent-color); color: #000; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; flex: 1; }
        .info-box { background-color: rgba(255, 159, 67, 0.1); border-left: 4px solid var(--accent-color); padding: 15px; margin-bottom: 30px; border-radius: 4px; }
        .form-section { background-color: var(--card-bg); border: 1px solid #444; border-radius: 6px; padding: 25px; margin-bottom: 40px; }
        .form-section h2 { margin-top: 0; color: var(--accent-color); border-bottom: 1px solid #444; padding-bottom: 10px; }
        .toggle-selector { display: flex; gap: 20px; margin-bottom: 20px; background: #1a1a1a; padding: 12px; border-radius: 4px; border: 1px solid #444; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        input, select { background-color: #1a1a1a; border: 1px solid #555; color: var(--text-color); padding: 10px; border-radius: 4px; font-size: 15px; }
        .btn-submit { background-color: var(--accent-color); color: #000; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .match-list { display: flex; flex-direction: column; gap: 15px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background-color: var(--card-bg); padding: 30px; border-radius: 6px; border: 1px solid var(--accent-color); width: 100%; max-width: 400px; }
    </style>
</head>
<body>

    <header>
        <h1>IPSC STARTPLATZ-BÖRSE</h1>
        <div class="header-controls">
            <div id="auth-status-container">
                <button class="btn-auth" id="btn-open-login">Login / Registrieren</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="info-box">
            <strong>Wichtiger Hinweis:</strong> Diese Plattform dient nur der Vermittlung.
        </div>

        <div class="form-section">
            <h2>Eintrag erstellen</h2>
            <div class="toggle-selector">
                <label><input type="radio" name="ad-type" value="offer" checked> Biete Startplatz</label>
                <label><input type="radio" name="ad-type" value="want"> Suche Startplatz</label>
            </div>

            <form id="match-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Name des Matches *</label>
                        <input type="text" id="match-name" required>
                    </div>
                    <div class="form-group">
                        <label>Match Level *</label>
                        <select id="match-level" required></select>
                    </div>
                    <div class="form-group">
                        <label>Datum *</label>
                        <input type="date" id="match-date" required>
                    </div>
                    <div class="form-group">
                        <label>Ort *</label>
                        <input type="text" id="match-location" required>
                    </div>
                    <div class="form-group">
                        <label>Squad Nummer</label>
                        <input type="text" id="match-squad">
                    </div>
                    <div class="form-group">
                        <label>Preis (€) *</label>
                        <input type="number" id="match-price" required>
                    </div>
                    <div class="form-group">
                        <label>E-Mail *</label>
                        <input type="email" id="seller-email" required readonly>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Veröffentlichen</button>
            </form>
        </div>

        <h2>Aktuelle Marktplatz-Einträge</h2>
        <div class="match-list" id="match-container"></div>
    </div>

    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <h3 style="color:var(--accent-color);">Login</h3>
            <form id="login-form">
                <div class="form-group"><label>E-Mail</label><input type="email" id="login-email" required></div>
                <div class="form-group"><label>Passwort</label><input type="password" id="login-password" required></div>
                <button type="submit" class="btn-submit" style="width:100%;">Einloggen</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
